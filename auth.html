<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ananta Service Center - Login</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#243b32;font-family:Segoe UI,system-ui,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:100%;max-width:430px;background:#fff;border:1px solid #d9d6c9;border-radius:14px;padding:25px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{margin:0 0 5px;color:#22453a}.muted{color:#68756f;font-size:13px}label{display:block;margin:13px 0 5px;font-size:13px;font-weight:700}
input{width:100%;padding:11px;border:1px solid #ccd6d0;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 15px;background:#2f5d4f;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.role{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.role button{background:#eef4f0;color:#2f5d4f;border:2px solid transparent}.role button.active{background:#2f5d4f;color:#fff;border-color:#2f5d4f}
.msg{margin-top:13px;font-size:13px;display:none}.msg.show{display:block}.err{color:#a43b32}.ok{color:#2f5d4f}.hidden{display:none!important}.pw{display:flex;gap:6px}.pw input{flex:1}.eye{background:#eef4f0;color:#2f5d4f;padding:8px 11px}.rowline{display:flex;justify-content:flex-end;margin-top:6px}.linkbtn{background:none;color:#2f5d4f;padding:3px;font-weight:700}
</style></head><body><div class="wrap"><div class="card">
<h1>Ananta Service Center</h1><p class="muted">Login Type चुनें</p>
<div class="role"><button id="serviceRole" class="active" type="button">🏢 Service Center</button><button id="techRole" type="button">🧰 Technician</button></div>
<h3 id="loginTitle">Service Center Login</h3>
<label>Email</label><input id="loginEmail" type="email" autocomplete="username">
<label>Password</label><div class="pw"><input id="loginPassword" type="password" autocomplete="current-password"><button type="button" class="eye" onclick="togglePw('loginPassword',this)">👁</button></div>
<div class="rowline"><button type="button" class="linkbtn" onclick="showForgot()">Forgot Password?</button></div>
<br><br><button id="loginBtn" style="width:100%">Login</button>
<div id="registerBox"><hr style="border:0;border-top:1px solid #e4e7e4;margin:22px 0"><h3>New Service Center</h3>
<label>Service Center Name</label><input id="regCenter"><label>Registration Email</label><input id="regEmail" type="email"><label>Password</label><div class="pw"><input id="regPassword" type="password" autocomplete="new-password"><button type="button" class="eye" onclick="togglePw('regPassword',this)">👁</button></div><br><br>
<button id="regBtn" style="width:100%">Register Service Center</button></div>
<div id="forgotBox" class="hidden">
<hr style="border:0;border-top:1px solid #e4e7e4;margin:22px 0">
<h3>Reset Password</h3>
<p class="muted">Apne registered email par reset link mangayein.</p>
<label>Email</label><input id="forgotEmail" type="email" autocomplete="email">
<br><br><button id="forgotBtn" style="width:100%">Send Reset Link</button>
<div class="rowline"><button type="button" class="linkbtn" onclick="hideForgot()">Back to Login</button></div>
</div>

<div id="newPasswordBox" class="hidden">
<hr style="border:0;border-top:1px solid #e4e7e4;margin:22px 0">
<h3>Set New Password</h3>
<label>New Password</label><div class="pw"><input id="newPassword" type="password"><button type="button" class="eye" onclick="togglePw('newPassword',this)">👁</button></div>
<label>Confirm Password</label><div class="pw"><input id="confirmPassword" type="password"><button type="button" class="eye" onclick="togglePw('confirmPassword',this)">👁</button></div>
<br><br><button id="resetBtn" style="width:100%">Update Password</button>
</div>
<p id="msg" class="msg"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://talzqxwoclrllbqudpkk.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let role="service";
const $=id=>document.getElementById(id);
function msg(text,ok=false){const e=$("msg");e.textContent=text;e.className="msg show "+(ok?"ok":"err")}
function busy(id,b,label){const e=$(id);e.disabled=b;e.textContent=b?"Please wait…":label}
function setRole(r){role=r;$("serviceRole").classList.toggle("active",r==="service");$("techRole").classList.toggle("active",r==="technician");$("loginTitle").textContent=r==="service"?"Service Center Login":"Technician Login";$("registerBox").classList.toggle("hidden",r!=="service");$("msg").className="msg"}
$("serviceRole").onclick=()=>setRole("service");$("techRole").onclick=()=>setRole("technician");

function togglePw(id,btn){const e=$(id);e.type=e.type==="password"?"text":"password";btn.textContent=e.type==="password"?"👁":"🙈"}
function showForgot(){
 $("loginBox").classList.add("hidden");$("registerBox").classList.add("hidden");$("forgotBox").classList.remove("hidden");$("newPasswordBox").classList.add("hidden");
 $("forgotEmail").value=$("loginEmail").value.trim();$("msg").className="msg";
}
function hideForgot(){setRole(role);$("forgotBox").classList.add("hidden");$("loginBox").classList.remove("hidden")}
async function sendReset(){
 const email=$("forgotEmail").value.trim().toLowerCase();
 if(!email)return msg("Email bharein.");
 busy("forgotBtn",true,"Send Reset Link");
 const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 busy("forgotBtn",false,"Send Reset Link");
 if(error)return msg(error.message);
 msg("Password reset link email par bhej diya gaya hai.",true);
}
async function updatePassword(){
 const p=$("newPassword").value,c=$("confirmPassword").value;
 if(p.length<6)return msg("Password kam se kam 6 characters ka hona chahiye.");
 if(p!==c)return msg("Password aur Confirm Password same nahi hain.");
 busy("resetBtn",true,"Update Password");
 const {error}=await db.auth.updateUser({password:p});
 busy("resetBtn",false,"Update Password");
 if(error)return msg(error.message);
 await db.auth.signOut();
 $("newPasswordBox").classList.add("hidden");$("loginBox").classList.remove("hidden");
 msg("Password update ho gaya. Ab login karein.",true);
}
async function login(){
 const email=$("loginEmail").value.trim().toLowerCase(),password=$("loginPassword").value;
 if(!email||!password)return msg("Email aur password bharein.");
 busy("loginBtn",true,"Login");
 const {data,error}=await db.auth.signInWithPassword({email,password});busy("loginBtn",false,"Login");
 if(error)return msg(error.message);if(!data.session)return msg("Login session nahi mila.");
 const u=data.user,meta=Object.assign({},u.user_metadata||{},u.app_metadata||{});
 if(role==="technician"){
   const {data:t,error:te}=await db.from("technicians").select("id,name,email,phone,technician_code,service_center_id,is_active").eq("auth_user_id",u.id).maybeSingle();
   if(te||!t){await db.auth.signOut();return msg("Ye login Technician account se linked nahi hai.");}
   if(t.is_active===false){await db.auth.signOut();return msg("Technician account inactive hai.");}
   localStorage.setItem("ananta_login_role","technician");location.href="technician.html";return;
 }
 let centerId=meta.service_center_id||"",center=null;
 if(centerId){const r=await db.from("service_centers").select("id,name,service_center_code").eq("id",centerId).maybeSingle();center=r.data}
 if(!center){const r=await db.from("service_centers").select("id,name,service_center_code").eq("owner_user_id",u.id).maybeSingle();center=r.data}
 if(!center){await db.auth.signOut();return msg("Service Center account link nahi mila.");}
 localStorage.setItem("ananta_login_role","service_center");location.href="index.html";
}
async function register(){
 const center=$("regCenter").value.trim(),email=$("regEmail").value.trim().toLowerCase(),password=$("regPassword").value;
 if(!center)return msg("Service Center name bharein.");if(!email)return msg("Email bharein.");if(password.length<6)return msg("Password kam se kam 6 characters ka hona chahiye.");
 busy("regBtn",true,"Register Service Center");
 const {data,error}=await db.auth.signUp({email,password,options:{data:{service_center_name:center,role:"SERVICE_CENTER"}}});
 busy("regBtn",false,"Register Service Center");if(error)return msg(error.message);
 if(data.session){localStorage.setItem("ananta_login_role","service_center");msg("Account create ho gaya. Dashboard khul raha hai…",true);setTimeout(()=>location.href="index.html",500)}
 else msg("Account create ho gaya. Email verify karein, phir Service Center Login karein.",true);
}
$("loginBtn").onclick=login;$("regBtn").onclick=register;$("forgotBtn").onclick=sendReset;$("resetBtn").onclick=updatePassword;

db.auth.onAuthStateChange(function(event,session){
 if(event==="PASSWORD_RECOVERY"){
   $("loginBox").classList.add("hidden");$("registerBox").classList.add("hidden");$("forgotBox").classList.add("hidden");$("newPasswordBox").classList.remove("hidden");
 }
});
</script></body></html>
