<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Service Center Account</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px
}
.card{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:28px;
  border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.12)
}
h1{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:#64748b;margin-bottom:22px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input{
  width:100%;
  padding:13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px
}
.password-box{position:relative}
.password-box input{padding-right:50px}
.eye{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  cursor:pointer;
  font-size:20px;
  width:auto;
  padding:5px
}
button.main{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer
}
.link{
  text-align:center;
  margin-top:16px;
  color:#2563eb;
  cursor:pointer
}
.message{
  display:none;
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  text-align:center
}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.hidden{display:none}
</style>
</head>

<body>

<div class="card">

<!-- LOGIN -->
<div id="loginBox">
<h1>Service Center Login</h1>
<div class="sub">Login to your account</div>

<label>Email</label>
<input id="loginEmail" type="email" placeholder="Enter email">

<label>Password</label>
<div class="password-box">
<input id="loginPassword" type="password" placeholder="Enter password">
<button class="eye" type="button"
onclick="togglePassword('loginPassword',this)">👁️</button>
</div>

<button class="main" onclick="login()">Login</button>

<div class="link" onclick="showForgot()">Forgot Password?</div>

<div class="link" onclick="showSignup()">
Create New Service Center Account
</div>

<div id="loginMsg" class="message"></div>
</div>


<!-- CREATE ACCOUNT -->
<div id="signupBox" class="hidden">
<h1>Create Account</h1>
<div class="sub">Create your Service Center account</div>

<label>Service Center Name</label>
<input id="centerName" type="text" placeholder="Service Center Name">

<label>Owner Name</label>
<input id="ownerName" type="text" placeholder="Owner Name">

<label>Mobile</label>
<input id="phone" type="tel" placeholder="Mobile Number">

<label>Email</label>
<input id="signupEmail" type="email" placeholder="Email Address">

<label>Password</label>
<div class="password-box">
<input id="signupPassword" type="password" placeholder="Minimum 6 characters">
<button class="eye" type="button"
onclick="togglePassword('signupPassword',this)">👁️</button>
</div>

<label>Confirm Password</label>
<div class="password-box">
<input id="confirmPassword" type="password" placeholder="Confirm password">
<button class="eye" type="button"
onclick="togglePassword('confirmPassword',this)">👁️</button>
</div>

<button class="main" onclick="signup()">Create Account</button>

<div class="link" onclick="showLogin()">Already have an account? Login</div>

<div id="signupMsg" class="message"></div>
</div>


<!-- FORGOT PASSWORD -->
<div id="forgotBox" class="hidden">
<h1>Forgot Password</h1>
<div class="sub">Enter your registered email</div>

<label>Email</label>
<input id="forgotEmail" type="email" placeholder="Enter email">

<button class="main" onclick="sendReset()">Send Reset Link</button>

<div class="link" onclick="showLogin()">← Back to Login</div>

<div id="forgotMsg" class="message"></div>
</div>

</div>


<script>

const SUPABASE_URL =
"https://talzqxwoclrllbqudpkk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// LOGIN
async function login(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email || !password){
showMessage("loginMsg","Email aur password enter karein.","error");
return;
}

const {error}=await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});

if(error){
showMessage("loginMsg",error.message,"error");
return;
}

showMessage("loginMsg","Login successful...","success");

setTimeout(()=>{
window.location.href="index.html";
},1000);

}


// CREATE ACCOUNT
async function signup(){

const centerName=document.getElementById("centerName").value.trim();
const ownerName=document.getElementById("ownerName").value.trim();
const phone=document.getElementById("phone").value.trim();
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;
const confirm=document.getElementById("confirmPassword").value;

if(!centerName || !ownerName || !phone || !email || !password || !confirm){
showMessage("signupMsg","Sabhi fields bharna zaroori hai.","error");
return;
}

if(password.length<6){
showMessage("signupMsg","Password kam se kam 6 characters ka hona chahiye.","error");
return;
}

if(password!==confirm){
showMessage("signupMsg","Password aur Confirm Password same nahi hain.","error");
return;
}

const {error}=await supabaseClient.auth.signUp({

email:email,
password:password,

options:{
data:{
service_center_name:centerName,
owner_name:ownerName,
phone:phone
},
emailRedirectTo:
"https://vishalkld.github.io/ananta-service/auth.html"
}

});

if(error){
showMessage("signupMsg",error.message,"error");
return;
}

showMessage(
"signupMsg",
"Account create ho gaya. Email verify karke Login karein.",
"success"
);

}


// FORGOT PASSWORD
async function sendReset(){

const email=document.getElementById("forgotEmail").value.trim();

if(!email){
showMessage("forgotMsg","Email enter karein.","error");
return;
}

const {error}=await supabaseClient.auth.resetPasswordForEmail(
email,
{
redirectTo:
"https://vishalkld.github.io/ananta-service/auth.html"
}
);

if(error){
showMessage("forgotMsg",error.message,"error");
return;
}

showMessage(
"forgotMsg",
"Password reset link aapke email par bhej diya gaya hai.",
"success"
);

}


// SHOW/HIDE PASSWORD
function togglePassword(id,button){

const input=document.getElementById(id);

if(input.type==="password"){
input.type="text";
button.textContent="🙈";
}else{
input.type="password";
button.textContent="👁️";
}

}


// PAGE SWITCH
function showSignup(){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("forgotBox").classList.add("hidden");
document.getElementById("signupBox").classList.remove("hidden");

}

function showLogin(){

document.getElementById("signupBox").classList.add("hidden");
document.getElementById("forgotBox").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");

}

function showForgot(){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("signupBox").classList.add("hidden");
document.getElementById("forgotBox").classList.remove("hidden");

}


// MESSAGE
function showMessage(id,text,type){

const box=document.getElementById(id);

box.textContent=text;
box.className="message "+type;
box.style.display="block";

}

</script>

</body>
</html>
