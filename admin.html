<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d31">
<title>Ananta Admin</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f3f6f4;
 color:#20352d;
 font-family:Arial,sans-serif
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:14px
}

.top{
 background:#173d31;
 color:#fff;
 padding:16px 0
}

.card{
 background:#fff;
 border:1px solid #dce4df;
 border-radius:14px;
 padding:16px;
 margin:14px 0;
 box-shadow:0 3px 12px #0001
}

h1,h2,h3{margin-top:0}

label{
 display:block;
 font-size:13px;
 font-weight:700;
 margin:10px 0 5px
}

input,select{
 width:100%;
 padding:12px;
 border:1px solid #cbd6d0;
 border-radius:9px;
 font:inherit;
 background:#fff
}

button{
 border:0;
 border-radius:9px;
 padding:11px 14px;
 background:#2f5d4f;
 color:#fff;
 font-weight:700;
 cursor:pointer
}

button:disabled{
 opacity:.5;
 cursor:not-allowed
}

.secondary{
 background:#e7eeea;
 color:#2f5d4f
}

.danger{
 background:#a43b32
}

.warning{
 background:#a56a16
}

.row{
 display:flex;
 gap:9px;
 flex-wrap:wrap
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

.statgrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}

.stat{
 background:#eef4f0;
 border-radius:11px;
 padding:15px;
 text-align:center
}

.stat b{
 display:block;
 font-size:26px
}

.center{
 border:1px solid #dce4df;
 border-radius:12px;
 padding:14px;
 margin:10px 0
}

.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 font-size:11px;
 font-weight:800
}

.active{
 background:#dff2e7;
 color:#17643b
}

.inactive{
 background:#f7dfdd;
 color:#8c3029
}

.error{
 color:#a43b32;
 font-weight:700
}

.success{
 color:#17643b;
 font-weight:700
}

.muted{
 color:#66756e;
 font-size:12px
}

.login{
 max-width:430px;
 margin:60px auto
}

.loader{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 z-index:100
}

.loaderBox{
 background:#fff;
 border-radius:16px;
 padding:28px;
 width:85%;
 max-width:340px;
 text-align:center
}

.spinner{
 width:42px;
 height:42px;
 border:4px solid #e5ebe7;
 border-top-color:#2f5d4f;
 border-radius:50%;
 animation:spin .8s linear infinite;
 margin:0 auto 15px
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@media(max-width:650px){
 .grid{grid-template-columns:1fr}
 .statgrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="root"></div>

<div id="loader" class="loader">
 <div class="loaderBox">
  <div class="spinner"></div>
  <b id="loaderText">Please wait...</b>
 </div>
</div>

<script>
(function(){

"use strict";

var SUPABASE_URL =
 "https://talzqxwoclrllbqudpkk.supabase.co";

var SUPABASE_KEY =
 "sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk";

var ADMIN_EMAIL =
 "ananta.services@yahoo.com";

var sb = null;
var currentUser = null;
var centers = [];

function esc(v){
 return String(v==null?"":v).replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function loadSupabase(cb){

 if(window.supabase &&
    window.supabase.createClient){
   cb();
   return;
 }

 var script=document.createElement("script");

 script.src=
 "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

 script.onload=function(){
  if(!window.supabase){
   alert("Supabase library load failed");
   return;
  }
  cb();
 };

 script.onerror=function(){
  alert("Supabase library could not load");
 };

 document.head.appendChild(script);
}

function loading(show,text){

 var el=document.getElementById("loader");

 if(!el)return;

 if(show){
  el.style.display="flex";
  document.getElementById("loaderText").textContent=
   text||"Please wait...";
 }else{
  el.style.display="none";
 }
}

function loginPage(msg){

 document.getElementById("root").innerHTML=
 '<div class="wrap">'+
 '<div class="card login">'+

 '<h1>Ananta Enterprises</h1>'+
 '<p class="muted">Administrator</p>'+

 '<h2>Admin Login</h2>'+

 '<label>Email</label>'+
 '<input id="loginEmail" type="email" autocomplete="username">'+

 '<label>Password</label>'+
 '<input id="loginPassword" type="password" autocomplete="current-password">'+

 '<br>'+

 '<button onclick="adminLogin()">Login</button>'+

 '<p id="loginError" class="error">'+
 esc(msg||"")+
 '</p>'+

 '</div>'+
 '</div>';
}

window.adminLogin=async function(){

 var email=
  document.getElementById("loginEmail").value.trim();

 var password=
  document.getElementById("loginPassword").value;

 var err=
  document.getElementById("loginError");

 if(!email||!password){
  err.textContent="Email और password required";
  return;
 }

 if(email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
  err.textContent="Admin access denied";
  return;
 }

 loading(true,"Admin login हो रहा है...");

 try{

  var r=await sb.auth.signInWithPassword({
   email:email,
   password:password
  });

  if(r.error)
   throw new Error(r.error.message);

  await boot();

 }catch(e){

  err.textContent=e.message;

 }finally{

  loading(false);

 }
};

async function boot(){

 var session=
  await sb.auth.getSession();

 if(session.error||
    !session.data.session){

  loginPage("");
  return;
 }

 currentUser=session.data.session.user;

 if(
  String(currentUser.email||"").toLowerCase() !==
  ADMIN_EMAIL.toLowerCase()
 ){

  await sb.auth.signOut();

  loginPage("Admin access denied");
  return;
 }

 render();
 await loadCenters();
}

async function callAdmin(action,data){

 var session=
  await sb.auth.getSession();

 if(session.error||
    !session.data.session){

  throw new Error("Login session expired");
 }

 var r=await sb.functions.invoke(
  "admin-service-center",
  {
   body:Object.assign(
    {action:action},
    data||{}
   ),
   headers:{
    Authorization:
     "Bearer "+
     session.data.session.access_token,
    apikey:SUPABASE_KEY
   }
  }
 );

 if(r.error){

  var message=
   r.data&&r.data.error
   ?r.data.error
   :r.error.message;

  throw new Error(message);
 }

 if(!r.data||
    !r.data.success){

  throw new Error(
   r.data&&r.data.error
   ?r.data.error
   :"Admin operation failed"
  );
 }

 return r.data;
}

async function loadCenters(){

 try{

  var r=
   await callAdmin("list");

  centers=
   Array.isArray(r.service_centers)
   ?r.service_centers
   :[];

  renderCenters();

 }catch(e){

  document.getElementById("centerList").innerHTML=
   '<p class="error">'+
   esc(e.message)+
   '</p>';

 }

}

function render(){

 document.getElementById("root").innerHTML=

 '<div class="top">'+
 '<div class="wrap">'+
 '<div class="row" style="justify-content:space-between;align-items:center">'+
 '<div>'+
 '<h1 style="margin-bottom:3px">Ananta Admin</h1>'+
 '<div style="font-size:12px">Service Center Management</div>'+
 '</div>'+
 '<button class="danger" onclick="logout()">Logout</button>'+
 '</div>'+
 '</div>'+
 '</div>'+

 '<main class="wrap">'+

 '<div class="statgrid">'+

 '<div class="stat">'+
 '<b id="totalCenters">0</b>'+
 '<span>Service Centers</span>'+
 '</div>'+

 '<div class="stat">'+
 '<b id="activeCenters">0</b>'+
 '<span>Active</span>'+
 '</div>'+

 '<div class="stat">'+
 '<b id="inactiveCenters">0</b>'+
 '<span>Inactive</span>'+
 '</div>'+

 '</div>'+

 '<div class="card">'+
 '<h2>➕ Add Service Center</h2>'+

 '<div class="grid">'+

 '<div>'+
 '<label>Service Center Name *</label>'+
 '<input id="scName" placeholder="Ananta Service Center">'+
 '</div>'+

 '<div>'+
 '<label>Owner Name *</label>'+
 '<input id="scOwner" placeholder="Owner name">'+
 '</div>'+

 '<div>'+
 '<label>Phone</label>'+
 '<input id="scPhone" type="tel" placeholder="Mobile number">'+
 '</div>'+

 '<div>'+
 '<label>Login Email *</label>'+
 '<input id="scEmail" type="email" placeholder="servicecenter@gmail.com">'+
 '</div>'+

 '<div>'+
 '<label>Login Password *</label>'+
 '<input id="scPassword" type="password" placeholder="Minimum 6 characters">'+
 '</div>'+

 '<div>'+
 '<label>Service Center Code</label>'+
 '<input id="scCode" placeholder="Auto generated if empty">'+
 '</div>'+

 '</div>'+

 '<br>'+

 '<button onclick="createCenter()">Create Service Center</button>'+

 '<p id="createMessage"></p>'+

 '</div>'+

 '<div class="card">'+
 '<div class="row" style="justify-content:space-between;align-items:center">'+
 '<div>'+
 '<h2 style="margin-bottom:3px">Service Centers</h2>'+
 '<div class="muted">Only Admin can manage these accounts.</div>'+
 '</div>'+
 '<button class="secondary" onclick="loadCenters()">↻ Refresh</button>'+
 '</div>'+

 '<div id="centerList">'+
 '<p class="muted">Loading...</p>'+
 '</div>'+

 '</div>'+

 '</main>';
}

function renderCenters(){

 var total=centers.length;

 var active=
  centers.filter(function(x){
   return x.is_active!==false;
  }).length;

 var inactive=
  total-active;

 document.getElementById("totalCenters").textContent=
  total;

 document.getElementById("activeCenters").textContent=
  active;

 document.getElementById("inactiveCenters").textContent=
  inactive;

 var box=
  document.getElementById("centerList");

 if(!centers.length){

  box.innerHTML=
   '<p class="muted">No Service Center found.</p>';

  return;
 }

 box.innerHTML=
  centers.map(function(c){

   var isActive=
    c.is_active!==false;

   return (

    '<div class="center">'+

    '<div class="row" style="justify-content:space-between;align-items:flex-start">'+

    '<div style="flex:1">'+

    '<h3>'+esc(c.name||"Service Center")+'</h3>'+

    '<p><b>Owner:</b> '+
    esc(c.owner_name||"—")+
    '</p>'+

    '<p><b>Phone:</b> '+
    esc(c.phone||"—")+
    '</p>'+

    '<p><b>Email:</b> '+
    esc(c.email||"—")+
    '</p>'+

    '<p><b>Code:</b> '+
    esc(c.service_center_code||"—")+
    '</p>'+

    '<span class="badge '+
    (isActive?"active":"inactive")+
    '">'+
    (isActive?"ACTIVE":"DISABLED")+
    '</span>'+

    '</div>'+

    '<div class="row">'+

    '<button class="'+
    (isActive?"warning":"")+
    '" onclick="toggleCenter(\''+
    esc(c.id)+
    '\','+
    (!isActive)+
    ')">'+
    (isActive?"Disable":"Enable")+
    '</button>'+

    '<button class="danger" onclick="deleteCenter(\''+
    esc(c.id)+
    '\',\''+
    esc(c.name||"")+
    '\')">'+
    'Delete'+
    '</button>'+

    '</div>'+

    '</div>'+

    '</div>'
   );

  }).join("");
}

window.createCenter=async function(){

 var message=
  document.getElementById("createMessage");

 var data={
  name:document.getElementById("scName").value.trim(),
  owner_name:document.getElementById("scOwner").value.trim(),
  phone:document.getElementById("scPhone").value.trim(),
  email:document.getElementById("scEmail").value.trim(),
  password:document.getElementById("scPassword").value,
  service_center_code:
   document.getElementById("scCode").value.trim()
 };

 message.textContent="";
 message.className="";

 if(!data.name||
    !data.owner_name||
    !data.email||
    !data.password){

  message.textContent=
   "Name, Owner, Email और Password required.";

  message.className="error";

  return;
 }

 loading(true,"Service Center बनाया जा रहा है...");

 try{

  var r=
   await callAdmin("create",data);

  message.textContent=
   "✓ Service Center successfully created. Code: "+
   (r.service_center.service_center_code||"");

  message.className="success";

  document.getElementById("scName").value="";
  document.getElementById("scOwner").value="";
  document.getElementById("scPhone").value="";
  document.getElementById("scEmail").value="";
  document.getElementById("scPassword").value="";
  document.getElementById("scCode").value="";

  await loadCenters();

 }catch(e){

  message.textContent=
   "Error: "+e.message;

  message.className="error";

 }finally{

  loading(false);

 }
};

window.toggleCenter=async function(id,active){

 var action=
  active
  ?"enable"
  :"disable";

 if(!confirm(
  active
  ?"Service Center enable करें?"
  :"Service Center disable करें?"
 ))return;

 loading(
  true,
  active
  ?"Service Center enable हो रहा है..."
  :"Service Center disable हो रहा है..."
 );

 try{

  await callAdmin(
   "set_status",
   {
    id:id,
    is_active:active
   }
  );

  await loadCenters();

 }catch(e){

  alert(e.message);

 }finally{

  loading(false);

 }
};

window.deleteCenter=async function(id,name){

 var ok=confirm(
  "क्या आप '"+name+
  "' को permanently delete करना चाहते हैं?\n\n"+
  "अगर इस Service Center में Technician मौजूद है "+
  "तो delete नहीं होगा।"
 );

 if(!ok)return;

 loading(true,"Service Center delete हो रहा है...");

 try{

  await callAdmin(
   "delete",
   {id:id}
  );

  alert("Service Center permanently deleted.");

  await loadCenters();

 }catch(e){

  alert(e.message);

 }finally{

  loading(false);

 }
};

window.logout=async function(){

 await sb.auth.signOut();

 currentUser=null;

 loginPage("");

};

loadSupabase(function(){

 sb=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );

 boot();

});

})();
</script>

</body>
</html>
