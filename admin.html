<head>

<title>Ananta Service Center Management System</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f3f6f4;
 color:#20352d;
 font-family:Arial,sans-serif
}

.top{
 background:#173d31;
 color:#fff;
 padding:15px 0
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:12px
}

.card{
 background:#fff;
 border:1px solid #dce4df;
 border-radius:14px;
 padding:16px;
 margin:14px 0;
 box-shadow:0 3px 12px #0001
}

h1,h2,h3{
 margin-top:0
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:10px 0 5px
}

input{
 width:100%;
 padding:11px;
 border:1px solid #ccd8d1;
 border-radius:9px;
 font:inherit
}

button{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 background:#2f5d4f;
 color:#fff;
 font-weight:bold
}

button.secondary{
 background:#e5eeea;
 color:#285447
}

button.warning{
 background:#a86c16
}

button.danger{
 background:#a33d34
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}

.stat{
 background:#edf4f0;
 padding:14px;
 border-radius:10px;
 text-align:center
}

.stat b{
 display:block;
 font-size:25px
}

.center{
 border:1px solid #dce5df;
 border-radius:12px;
 padding:14px;
 margin:10px 0
}

.centerTitle{
 font-size:17px;
 font-weight:bold;
 margin-bottom:8px
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold
}

.active{
 background:#dff2e7;
 color:#17643b
}

.disabled{
 background:#f4dedd;
 color:#8d3029
}

.error{
 color:#a3342d;
 font-weight:bold
}

.success{
 color:#17643b;
 font-weight:bold
}

.muted{
 color:#68766f;
 font-size:12px
}

.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:10px
}

.login{
 max-width:420px;
 margin:60px auto
}

.loader{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 z-index:999
}

.loaderBox{
 background:white;
 border-radius:15px;
 padding:25px;
 width:85%;
 max-width:330px;
 text-align:center
}

.spinner{
 width:40px;
 height:40px;
 border:4px solid #e5ebe7;
 border-top-color:#2f5d4f;
 border-radius:50%;
 animation:spin .8s linear infinite;
 margin:0 auto 12px
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@media(max-width:650px){
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
}
</style>

<body>

<div id="root"></div>

<div id="loader" class="loader">
 <div class="loaderBox">
  <div class="spinner"></div>
  <b id="loaderText">Please wait...</b>
 </div>
</div>

<script>
(function(){

"use strict";

const SUPABASE_URL =
"https://talzqxwoclrllbqudpkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk";

const ADMIN_EMAIL =
"ananta.services@yahoo.com";

let sb=null;
let centers=[];
let centerSearch="";
let centerPage=1;
let centerPageSize=10;

function esc(v){
 return String(v==null?"":v)
 .replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function loading(show,text){

 const x=document.getElementById("loader");

 if(!x)return;

 x.style.display=
  show?"flex":"none";

 if(show){
  document.getElementById(
   "loaderText"
  ).textContent=
   text||"Please wait...";
 }
}

function loginPage(message){

 document.getElementById("root").innerHTML=`

 <div class="wrap">
  <div class="card login">

   <h1>Ananta Enterprises</h1>
   <p class="muted">Administrator</p>

   <h2>Admin Login</h2>

   <label>Email</label>
   <input id="loginEmail"
    type="email">

   <label>Password</label>
   <input id="loginPassword"
    type="password">

   <br>

   <button onclick="adminLogin()">
    Login
   </button>

   <p id="loginError"
      class="error">${esc(message||"")}</p>

  </div>
 </div>`;
}

window.adminLogin=async function(){

 const email=
  document.getElementById(
   "loginEmail"
  ).value.trim();

 const password=
  document.getElementById(
   "loginPassword"
  ).value;

 const error=
  document.getElementById(
   "loginError"
  );

 if(
  email.toLowerCase() !==
  ADMIN_EMAIL.toLowerCase()
 ){
  error.textContent=
   "Admin access denied";
  return;
 }

 if(!password){
  error.textContent=
   "Password required";
  return;
 }

 loading(
  true,
  "Admin login हो रहा है..."
 );

 try{

  const r=
   await sb.auth.signInWithPassword({
    email,
    password
   });

  if(r.error)
   throw new Error(
    r.error.message
   );

  await boot();

 }catch(e){

  error.textContent=
   e.message;

 }finally{

  loading(false);
 }
};

async function boot(){

 const r=
  await sb.auth.getSession();

 if(
  r.error ||
  !r.data.session
 ){
  loginPage("");
  return;
 }

 const user=
  r.data.session.user;

 if(
  String(user.email||"")
  .toLowerCase() !==
  ADMIN_EMAIL.toLowerCase()
 ){

  await sb.auth.signOut();

  loginPage(
   "Admin access denied"
  );

  return;
 }

 render();

 await loadCenters();
}

async function callAdmin(
 action,
 data
){

 const session=
  await sb.auth.getSession();

 if(
  !session.data.session
 ){
  throw new Error(
   "Admin session expired"
  );
 }

 const result=
  await sb.functions.invoke(
   "admin-service-center",
   {
    body:Object.assign(
     {action},
     data||{}
    ),
    headers:{
     Authorization:
      "Bearer "+
      session.data.session
      .access_token,
     apikey:SUPABASE_KEY
    }
   }
  );

 if(result.error){

  let msg=
   result.error.message;

  if(
   result.data &&
   result.data.error
  ){
   msg=result.data.error;
  }

  throw new Error(msg);
 }

 if(
  !result.data ||
  !result.data.success
 ){
  throw new Error(
   result.data?.error ||
   "Operation failed"
  );
 }

 return result.data;
}

async function loadCenters(){

 try{

  const r=
   await callAdmin("list");

  centers=
   Array.isArray(
    r.service_centers
   )
   ?r.service_centers
   :[];

  renderCenters();

 }catch(e){

  document.getElementById(
   "centerList"
  ).innerHTML=
   `<p class="error">
    ${esc(e.message)}
   </p>`;
 }
}

function render(){

 document.getElementById(
  "root"
 ).innerHTML=`

 <div class="top">
  <div class="wrap">

   <div style="
    display:flex;
    justify-content:space-between;
    align-items:center">

    <div>
     <h1 style="margin:0">
      Ananta Service Center Management System
     </h1>
     <div style="font-size:12px">
      Ananta Service Center Management System
     </div>
    </div>

    <div style="display:flex;gap:8px;align-items:center"><button type="button" class="secondary" id="adminLangBtn" onclick="toggleAdminLang()">हिंदी</button><button class="danger" onclick="logout()">Logout</button></div>

   </div>

  </div>
 </div>

 <main class="wrap">

  <div class="stats">

   <div class="stat">
    <b id="totalCenters">0</b>
    Service Centers
   </div>

   <div class="stat">
    <b id="activeCenters">0</b>
    Active
   </div>

   <div class="stat">
    <b id="inactiveCenters">0</b>
    Disabled
   </div>

  </div>

  <div class="card">

   <h2>➕ Add Service Center</h2>

   <div class="grid">

    <div>
     <label>
      Service Center Name *
     </label>
     <input id="scName"
      placeholder="Service Center Name">
    </div>

    <div>
     <label>
      Owner Name *
     </label>
     <input id="scOwner"
      placeholder="Owner name">
    </div>

    <div>
     <label>Phone</label>
     <input id="scPhone"
      type="tel"
      placeholder="Mobile number">
    </div>

    <div>
     <label>Login Email *</label>
     <input id="scEmail"
      type="email"
      placeholder="servicecenter@gmail.com">
    </div>

    <div>
     <label>
      Login Password *
     </label>
     <input id="scPassword"
      type="password"
      placeholder="Minimum 6 characters">
    </div>

    <div>
     <label>
      Service Center Code
     </label>
     <input id="scCode"
      placeholder="Auto generated">
    </div>

   </div>

   <br>

   <button onclick="createCenter()">
    Create Service Center
   </button>

   <p id="createMessage"></p>

  </div>

  <div class="card">

   <div style="
    display:flex;
    justify-content:space-between;
    align-items:center">

    <div>
     <h2 style="margin-bottom:3px">
      Service Centers
     </h2>

     <div class="muted">
      Technician accounts are kept
      separate automatically.
     </div>
    </div>

    <button
     class="secondary"
     onclick="loadCenters()">
     ↻ Refresh
    </button>

   </div>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
 <input id="centerSearch" placeholder="Search Name / Owner / Mobile / Email / Code" oninput="filterCenters()" style="flex:1;min-width:220px">
 <button class="secondary" onclick="clearCenterSearch()">Clear</button>
</div>
<div id="centerPagination" style="display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap;margin:8px 0"></div>
   <div id="centerList">
    Loading...
   </div>

  </div>

 </main>`;
}

function getFilteredCenters(){
 const q=String(centerSearch||"").trim().toLowerCase();
 if(!q)return centers.slice();
 return centers.filter(function(c){
   return [c.name,c.owner_name,c.phone,c.email,c.address,c.service_center_code,c.id]
     .map(function(v){return String(v==null?"":v).toLowerCase()})
     .some(function(v){return v.indexOf(q)>=0});
 });
}

window.filterCenters=function(){
 const el=document.getElementById("centerSearch");
 centerSearch=el?el.value:"";
 centerPage=1;
 renderCenters();
};
window.clearCenterSearch=function(){
 centerSearch="";centerPage=1;
 const el=document.getElementById("centerSearch");if(el)el.value="";
 renderCenters();
};
window.goCenterPage=function(p){centerPage=p;renderCenters();};
window.setCenterPageSize=function(n){centerPageSize=Number(n)||10;centerPage=1;renderCenters();};

function renderCenters(){
 const total=centers.length;
 const active=centers.filter(function(x){return x.is_active!==false}).length;
 document.getElementById("totalCenters").textContent=total;
 document.getElementById("activeCenters").textContent=active;
 document.getElementById("inactiveCenters").textContent=total-active;

 const all=getFilteredCenters();
 const pages=Math.max(1,Math.ceil(all.length/centerPageSize));
 if(centerPage>pages)centerPage=pages;
 const start=(centerPage-1)*centerPageSize;
 const pageRows=all.slice(start,start+centerPageSize);
 const box=document.getElementById("centerList");
 if(!all.length){box.innerHTML='<p class="muted">No matching Service Center found.</p>';}else{
   box.innerHTML=pageRows.map(function(c){
    const active=c.is_active!==false;
    return `<div class="center">
      <div class="centerTitle">${esc(c.name||"Service Center")}</div>
      <div><b>Owner:</b> ${esc(c.owner_name||"—")}</div>
      <div><b>Phone:</b> ${esc(c.phone||"—")}</div>
      <div><b>Email:</b> ${esc(c.email||"—")}</div>
      <div><b>Code:</b> ${esc(c.service_center_code||"—")}</div><br>
      <span class="badge ${active?"active":"disabled"}">${active?"ACTIVE":"DISABLED"}</span>
      <div class="actions">
       <button onclick='editCenter(${JSON.stringify(c)})'>✏️ Edit</button>
       <button class="${active?"warning":""}" onclick="toggleCenter('${esc(c.id)}',${!active})">${active?"Disable":"Enable"}</button>
       <button class="danger" onclick="deleteCenter('${esc(c.id)}','${esc(c.name||"")}')">Delete</button>
      </div>
    </div>`;
   }).join("");
 }
 const pager=document.getElementById("centerPagination");
 if(!pager)return;
 pager.innerHTML=`<span class="muted" style="margin-right:5px">${all.length?start+1:0}-${Math.min(start+pageRows.length,all.length)} of ${all.length}</span>`+
  `<select onchange="setCenterPageSize(this.value)" style="padding:5px 7px"><option value="10" ${centerPageSize===10?"selected":""}>10</option><option value="20" ${centerPageSize===20?"selected":""}>20</option><option value="50" ${centerPageSize===50?"selected":""}>50</option><option value="100" ${centerPageSize===100?"selected":""}>100</option></select>`+
  `<button class="secondary" onclick="goCenterPage(1)" ${centerPage<=1?'disabled':''}>«</button>`+
  `<button class="secondary" onclick="goCenterPage(${Math.max(1,centerPage-1)})" ${centerPage<=1?'disabled':''}>‹</button>`+
  Array.from({length:pages},(_,i)=>i+1).slice(Math.max(0,centerPage-3),Math.min(pages,centerPage+2)).map(p=>`<button class="${p===centerPage?'':'secondary'}" onclick="goCenterPage(${p})">${p}</button>`).join("")+
  `<button class="secondary" onclick="goCenterPage(${Math.min(pages,centerPage+1)})" ${centerPage>=pages?'disabled':''}>›</button>`+`<button class="secondary" onclick="goCenterPage(${pages})" ${centerPage>=pages?'disabled':''}>»</button>`;
 const search=document.getElementById("centerSearch");if(search&&search.value!==centerSearch)search.value=centerSearch;
}

// ==========================================================
// CREATE
// ==========================================================

window.createCenter=
async function(){

 const msg=
  document.getElementById(
   "createMessage"
  );

 const data={
  name:
   document.getElementById(
    "scName"
   ).value.trim(),

  owner_name:
   document.getElementById(
    "scOwner"
   ).value.trim(),

  phone:
   document.getElementById(
    "scPhone"
   ).value.trim(),

  email:
   document.getElementById(
    "scEmail"
   ).value.trim(),

  password:
   document.getElementById(
    "scPassword"
   ).value,

  service_center_code:
   document.getElementById(
    "scCode"
   ).value.trim()
 };

 if(
  !data.name ||
  !data.owner_name ||
  !data.email ||
  !data.password
 ){
  msg.className="error";
  msg.textContent=
   "Name, Owner, Email और Password required.";
  return;
 }

 loading(
  true,
  "Creating Service Center..."
 );

 try{

  const r=
   await callAdmin(
    "create",
    data
   );

  msg.className="success";

  msg.textContent=
   "✓ Created successfully. Code: "+
   r.service_center
    .service_center_code;

  [
   "scName",
   "scOwner",
   "scPhone",
   "scEmail",
   "scPassword",
   "scCode"
  ].forEach(
   id=>{
    document.getElementById(
     id
    ).value="";
   }
  );

  await loadCenters();

 }catch(e){

  msg.className="error";

  msg.textContent=
   "Error: "+e.message;

 }finally{

  loading(false);
 }
};

// ==========================================================
// EDIT
// ==========================================================

window.editCenter=
function(c){

 const newName=
  prompt(
   "Service Center Name:",
   c.name||""
  );

 if(newName===null)return;

 const owner=
  prompt(
   "Owner Name:",
   c.owner_name||""
  );

 if(owner===null)return;

 const phone=
  prompt(
   "Phone:",
   c.phone||""
  );

 if(phone===null)return;

 const email=
  prompt(
   "Login Email:",
   c.email||""
  );

 if(email===null)return;

 const password=
  prompt(
   "New Password:\n\n"+
   "पुराना password वही रहेगा अगर खाली छोड़ें।",
   ""
  );

 if(password===null)return;

 updateCenter({
  id:c.id,
  name:newName.trim(),
  owner_name:owner.trim(),
  phone:phone.trim(),
  email:email.trim(),
  password:password.trim()
 });
};

async function updateCenter(data){

 loading(
  true,
  "Updating Service Center..."
 );

 try{

  await callAdmin(
   "update",
   data
  );

  alert(
   "✓ Service Center updated successfully."
  );

  await loadCenters();

 }catch(e){

  alert(
   "Update failed: "+
   e.message
  );

 }finally{

  loading(false);
 }
}

// ==========================================================
// ENABLE / DISABLE
// ==========================================================

window.toggleCenter=
async function(id,active){

 if(
  !confirm(
   active
   ?"Enable Service Center?"
   :"Disable Service Center?"
  )
 )return;

 loading(
  true,
  active
  ?"Enable हो रहा है..."
  :"Disable हो रहा है..."
 );

 try{

  await callAdmin(
   "set_status",
   {
    id,
    is_active:active
   }
  );

  await loadCenters();

 }catch(e){

  alert(e.message);

 }finally{

  loading(false);
 }
};

// ==========================================================
// DELETE
// ==========================================================

window.deleteCenter=
async function(id,name){

 if(
  !confirm(
   "क्या '"+name+
   "' को permanently delete करना है?\n\n"+
   "अगर Technician linked है तो delete नहीं होगा."
  )
 )return;

 loading(
  true,
  "Deleting Service Center..."
 );

 try{

  await callAdmin(
   "delete",
   {id}
  );

  alert(
   "Service Center deleted."
  );

  await loadCenters();

 }catch(e){

  alert(e.message);

 }finally{

  loading(false);
 }
};

// LOGOUT

window.logout=
async function(){

 await sb.auth.signOut();

 loginPage("");
};

// SUPABASE

function start(){

 sb=
  window.supabase.createClient(
   SUPABASE_URL,

  );

 boot();
}

const script=
 document.createElement("script");

script.src=
 "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

script.onload=start;

script.onerror=
 function(){
  alert(
   "Supabase library load failed"
  );
 };

document.head.appendChild(
 script
);

})();
</script>

};
const sourceText=new WeakMap(), sourceAttr=new WeakMap(), reverse={};
Object.keys(D).forEach(k=>{reverse[D[k].en]=k;reverse[D[k].hi]=k});
function tr(v){
 v=String(v??'');
 if(lang==='en') return D[v]?.en || (reverse[v]&&D[reverse[v]]?.en) || v;
 return D[v]?.hi || (reverse[v]&&D[reverse[v]]?.hi) || v;
}
function apply(){
 document.documentElement.lang=lang;
 document.title=lang==='hi'?'अनंता सर्विस सेंटर मैनेजमेंट सिस्टम':'Ananta Service Center Management System';
 const btn=document.getElementById('adminLangBtn');if(btn)btn.textContent=lang==='hi'?'English':'हिंदी';
 const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT),nodes=[];let n;
 while(n=w.nextNode())nodes.push(n);
 nodes.forEach(node=>{
   if(node.parentElement?.closest('script,style'))return;
   if(!sourceText.has(node))sourceText.set(node,node.nodeValue);
   const src=sourceText.get(node),lead=(src.match(/^\s*/)||[''])[0],trail=(src.match(/\s*$/)||[''])[0],core=src.trim();
   if(core)node.nodeValue=lead+tr(core)+trail;
 });
 document.querySelectorAll('input,textarea,select,button,[title],[aria-label]').forEach(e=>{
   let attrs=sourceAttr.get(e);if(!attrs){attrs={};sourceAttr.set(e,attrs)}
   ['placeholder','title','aria-label'].forEach(k=>{
     if(e.hasAttribute(k)&&attrs[k]===undefined)attrs[k]=e.getAttribute(k);
     if(attrs[k]!==undefined)e.setAttribute(k,tr(attrs[k]));
   });
 });
}
window.toggleAdminLang=function(){lang=lang==='hi'?'en':'hi';localStorage.setItem('ananta_admin_lang',lang);apply()};
setTimeout(apply,50);
})();
</script>
