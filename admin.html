<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d31">
<title>Ananta Admin</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f3f6f4;
 color:#20352d;
 font-family:Arial,sans-serif
}

.top{
 background:#173d31;
 color:#fff;
 padding:15px 0
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:12px
}

.card{
 background:#fff;
 border:1px solid #dce4df;
 border-radius:14px;
 padding:16px;
 margin:14px 0;
 box-shadow:0 3px 12px #0001
}

h1,h2,h3{
 margin-top:0
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin:10px 0 5px
}

input{
 width:100%;
 padding:11px;
 border:1px solid #ccd8d1;
 border-radius:9px;
 font:inherit
}

button{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 background:#2f5d4f;
 color:#fff;
 font-weight:bold
}

button.secondary{
 background:#e5eeea;
 color:#285447
}

button.warning{
 background:#a86c16
}

button.danger{
 background:#a33d34
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}

.stat{
 background:#edf4f0;
 padding:14px;
 border-radius:10px;
 text-align:center
}

.stat b{
 display:block;
 font-size:25px
}

.center{
 border:1px solid #dce5df;
 border-radius:12px;
 padding:14px;
 margin:10px 0
}

.centerTitle{
 font-size:17px;
 font-weight:bold;
 margin-bottom:8px
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
 font-weight:bold
}

.active{
 background:#dff2e7;
 color:#17643b
}

.disabled{
 background:#f4dedd;
 color:#8d3029
}

.error{
 color:#a3342d;
 font-weight:bold
}

.success{
 color:#17643b;
 font-weight:bold
}

.muted{
 color:#68766f;
 font-size:12px
}

.actions{
 display:flex;
 gap:7px;
 flex-wrap:wrap;
 margin-top:10px
}

.login{
 max-width:420px;
 margin:60px auto
}

.loader{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 z-index:999
}

.loaderBox{
 background:white;
 border-radius:15px;
 padding:25px;
 width:85%;
 max-width:330px;
 text-align:center
}

.spinner{
 width:40px;
 height:40px;
 border:4px solid #e5ebe7;
 border-top-color:#2f5d4f;
 border-radius:50%;
 animation:spin .8s linear infinite;
 margin:0 auto 12px
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

@media(max-width:650px){
 .grid{grid-template-columns:1fr}
 .stats{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="root"></div>

<div id="loader" class="loader">
 <div class="loaderBox">
  <div class="spinner"></div>
  <b id="loaderText">Please wait...</b>
 </div>
</div>

<script>
(function(){

"use strict";

const SUPABASE_URL =
"https://talzqxwoclrllbqudpkk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk";

const ADMIN_EMAIL =
"ananta.services@yahoo.com";

let sb=null;
let centers=[];

function esc(v){
 return String(v==null?"":v)
 .replace(/[&<>"']/g,function(c){
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}

function loading(show,text){

 const x=document.getElementById("loader");

 if(!x)return;

 x.style.display=
  show?"flex":"none";

 if(show){
  document.getElementById(
   "loaderText"
  ).textContent=
   text||"Please wait...";
 }
}

function loginPage(message){

 document.getElementById("root").innerHTML=`

 <div class="wrap">
  <div class="card login">

   <h1>Ananta Enterprises</h1>
   <p class="muted">Administrator</p>

   <h2>Admin Login</h2>

   <label>Email</label>
   <input id="loginEmail"
    type="email">

   <label>Password</label>
   <input id="loginPassword"
    type="password">

   <br>

   <button onclick="adminLogin()">
    Login
   </button>

   <p id="loginError"
      class="error">${esc(message||"")}</p>

  </div>
 </div>`;
}

window.adminLogin=async function(){

 const email=
  document.getElementById(
   "loginEmail"
  ).value.trim();

 const password=
  document.getElementById(
   "loginPassword"
  ).value;

 const error=
  document.getElementById(
   "loginError"
  );

 if(
  email.toLowerCase() !==
  ADMIN_EMAIL.toLowerCase()
 ){
  error.textContent=
   "Admin access denied";
  return;
 }

 if(!password){
  error.textContent=
   "Password required";
  return;
 }

 loading(
  true,
  "Admin login हो रहा है..."
 );

 try{

  const r=
   await sb.auth.signInWithPassword({
    email,
    password
   });

  if(r.error)
   throw new Error(
    r.error.message
   );

  await boot();

 }catch(e){

  error.textContent=
   e.message;

 }finally{

  loading(false);
 }
};

async function boot(){

 const r=
  await sb.auth.getSession();

 if(
  r.error ||
  !r.data.session
 ){
  loginPage("");
  return;
 }

 const user=
  r.data.session.user;

 if(
  String(user.email||"")
  .toLowerCase() !==
  ADMIN_EMAIL.toLowerCase()
 ){

  await sb.auth.signOut();

  loginPage(
   "Admin access denied"
  );

  return;
 }

 render();

 await loadCenters();
}

async function callAdmin(
 action,
 data
){

 const session=
  await sb.auth.getSession();

 if(
  !session.data.session
 ){
  throw new Error(
   "Admin session expired"
  );
 }

 const result=
  await sb.functions.invoke(
   "admin-service-center",
   {
    body:Object.assign(
     {action},
     data||{}
    ),
    headers:{
     Authorization:
      "Bearer "+
      session.data.session
      .access_token,
     apikey:SUPABASE_KEY
    }
   }
  );

 if(result.error){

  let msg=
   result.error.message;

  if(
   result.data &&
   result.data.error
  ){
   msg=result.data.error;
  }

  throw new Error(msg);
 }

 if(
  !result.data ||
  !result.data.success
 ){
  throw new Error(
   result.data?.error ||
   "Operation failed"
  );
 }

 return result.data;
}

async function loadCenters(){

 try{

  const r=
   await callAdmin("list");

  centers=
   Array.isArray(
    r.service_centers
   )
   ?r.service_centers
   :[];

  renderCenters();

 }catch(e){

  document.getElementById(
   "centerList"
  ).innerHTML=
   `<p class="error">
    ${esc(e.message)}
   </p>`;
 }
}

function render(){

 document.getElementById(
  "root"
 ).innerHTML=`

 <div class="top">
  <div class="wrap">

   <div style="
    display:flex;
    justify-content:space-between;
    align-items:center">

    <div>
     <h1 style="margin:0">
      Ananta Admin
     </h1>
     <div style="font-size:12px">
      Service Center Management
     </div>
    </div>

    <button class="danger"
      onclick="logout()">
      Logout
    </button>

   </div>

  </div>
 </div>

 <main class="wrap">

  <div class="stats">

   <div class="stat">
    <b id="totalCenters">0</b>
    Service Centers
   </div>

   <div class="stat">
    <b id="activeCenters">0</b>
    Active
   </div>

   <div class="stat">
    <b id="inactiveCenters">0</b>
    Disabled
   </div>

  </div>

  <div class="card">

   <h2>➕ Add Service Center</h2>

   <div class="grid">

    <div>
     <label>
      Service Center Name *
     </label>
     <input id="scName"
      placeholder="Ananta Service Center">
    </div>

    <div>
     <label>
      Owner Name *
     </label>
     <input id="scOwner"
      placeholder="Owner name">
    </div>

    <div>
     <label>Phone</label>
     <input id="scPhone"
      type="tel"
      placeholder="Mobile number">
    </div>

    <div>
     <label>Login Email *</label>
     <input id="scEmail"
      type="email"
      placeholder="servicecenter@gmail.com">
    </div>

    <div>
     <label>
      Login Password *
     </label>
     <input id="scPassword"
      type="password"
      placeholder="Minimum 6 characters">
    </div>

    <div>
     <label>
      Service Center Code
     </label>
     <input id="scCode"
      placeholder="Auto generated">
    </div>

   </div>

   <br>

   <button onclick="createCenter()">
    Create Service Center
   </button>

   <p id="createMessage"></p>

  </div>

  <div class="card">

   <div style="
    display:flex;
    justify-content:space-between;
    align-items:center">

    <div>
     <h2 style="margin-bottom:3px">
      Service Centers
     </h2>

     <div class="muted">
      Technician accounts are kept
      separate automatically.
     </div>
    </div>

    <button
     class="secondary"
     onclick="loadCenters()">
     ↻ Refresh
    </button>

   </div>

   <div id="centerList">
    Loading...
   </div>

  </div>

 </main>`;
}

function renderCenters(){

 const total=
  centers.length;

 const active=
  centers.filter(
   x=>x.is_active!==false
  ).length;

 document.getElementById(
  "totalCenters"
 ).textContent=total;

 document.getElementById(
  "activeCenters"
 ).textContent=active;

 document.getElementById(
  "inactiveCenters"
 ).textContent=
  total-active;

 const box=
  document.getElementById(
   "centerList"
  );

 if(!centers.length){

  box.innerHTML=
   `<p class="muted">
    No Service Center found.
   </p>`;

  return;
 }

 box.innerHTML=
 centers.map(function(c){

  const active=
   c.is_active!==false;

  return `

  <div class="center">

   <div class="centerTitle">
    ${esc(c.name||"Service Center")}
   </div>

   <div>
    <b>Owner:</b>
    ${esc(c.owner_name||"—")}
   </div>

   <div>
    <b>Phone:</b>
    ${esc(c.phone||"—")}
   </div>

   <div>
    <b>Email:</b>
    ${esc(c.email||"—")}
   </div>

   <div>
    <b>Code:</b>
    ${esc(c.service_center_code||"—")}
   </div>

   <br>

   <span class="badge ${
    active?"active":"disabled"
   }">
    ${active?"ACTIVE":"DISABLED"}
   </span>

   <div class="actions">

    <button
     onclick='editCenter(${JSON.stringify(c)})'>
     ✏️ Edit
    </button>

    <button
     class="${
      active?"warning":""
     }"
     onclick="toggleCenter(
      '${esc(c.id)}',
      ${!active}
     )">

     ${
      active
      ?"Disable"
      :"Enable"
     }

    </button>

    <button
     class="danger"
     onclick="deleteCenter(
      '${esc(c.id)}',
      '${esc(c.name||"")}'
     )">

     Delete

    </button>

   </div>

  </div>`;
 }).join("");
}

// ==========================================================
// CREATE
// ==========================================================

window.createCenter=
async function(){

 const msg=
  document.getElementById(
   "createMessage"
  );

 const data={
  name:
   document.getElementById(
    "scName"
   ).value.trim(),

  owner_name:
   document.getElementById(
    "scOwner"
   ).value.trim(),

  phone:
   document.getElementById(
    "scPhone"
   ).value.trim(),

  email:
   document.getElementById(
    "scEmail"
   ).value.trim(),

  password:
   document.getElementById(
    "scPassword"
   ).value,

  service_center_code:
   document.getElementById(
    "scCode"
   ).value.trim()
 };

 if(
  !data.name ||
  !data.owner_name ||
  !data.email ||
  !data.password
 ){
  msg.className="error";
  msg.textContent=
   "Name, Owner, Email और Password required.";
  return;
 }

 loading(
  true,
  "Service Center बनाया जा रहा है..."
 );

 try{

  const r=
   await callAdmin(
    "create",
    data
   );

  msg.className="success";

  msg.textContent=
   "✓ Created successfully. Code: "+
   r.service_center
    .service_center_code;

  [
   "scName",
   "scOwner",
   "scPhone",
   "scEmail",
   "scPassword",
   "scCode"
  ].forEach(
   id=>{
    document.getElementById(
     id
    ).value="";
   }
  );

  await loadCenters();

 }catch(e){

  msg.className="error";

  msg.textContent=
   "Error: "+e.message;

 }finally{

  loading(false);
 }
};

// ==========================================================
// EDIT
// ==========================================================

window.editCenter=
function(c){

 const newName=
  prompt(
   "Service Center Name:",
   c.name||""
  );

 if(newName===null)return;

 const owner=
  prompt(
   "Owner Name:",
   c.owner_name||""
  );

 if(owner===null)return;

 const phone=
  prompt(
   "Phone:",
   c.phone||""
  );

 if(phone===null)return;

 const email=
  prompt(
   "Login Email:",
   c.email||""
  );

 if(email===null)return;

 const password=
  prompt(
   "New Password:\n\n"+
   "पुराना password वही रहेगा अगर खाली छोड़ें।",
   ""
  );

 if(password===null)return;

 updateCenter({
  id:c.id,
  name:newName.trim(),
  owner_name:owner.trim(),
  phone:phone.trim(),
  email:email.trim(),
  password:password.trim()
 });
};

async function updateCenter(data){

 loading(
  true,
  "Service Center update हो रहा है..."
 );

 try{

  await callAdmin(
   "update",
   data
  );

  alert(
   "✓ Service Center updated successfully."
  );

  await loadCenters();

 }catch(e){

  alert(
   "Update failed: "+
   e.message
  );

 }finally{

  loading(false);
 }
}

// ==========================================================
// ENABLE / DISABLE
// ==========================================================

window.toggleCenter=
async function(id,active){

 if(
  !confirm(
   active
   ?"Service Center enable करें?"
   :"Service Center disable करें?"
  )
 )return;

 loading(
  true,
  active
  ?"Enable हो रहा है..."
  :"Disable हो रहा है..."
 );

 try{

  await callAdmin(
   "set_status",
   {
    id,
    is_active:active
   }
  );

  await loadCenters();

 }catch(e){

  alert(e.message);

 }finally{

  loading(false);
 }
};

// ==========================================================
// DELETE
// ==========================================================

window.deleteCenter=
async function(id,name){

 if(
  !confirm(
   "क्या '"+name+
   "' को permanently delete करना है?\n\n"+
   "अगर Technician linked है तो delete नहीं होगा."
  )
 )return;

 loading(
  true,
  "Service Center delete हो रहा है..."
 );

 try{

  await callAdmin(
   "delete",
   {id}
  );

  alert(
   "Service Center deleted."
  );

  await loadCenters();

 }catch(e){

  alert(e.message);

 }finally{

  loading(false);
 }
};

// ==========================================================
// LOGOUT
// ==========================================================

window.logout=
async function(){

 await sb.auth.signOut();

 loginPage("");
};

// ==========================================================
// SUPABASE
// ==========================================================

function start(){

 sb=
  window.supabase.createClient(
   SUPABASE_URL,
   SUPABASE_KEY
  );

 boot();
}

const script=
 document.createElement("script");

script.src=
 "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

script.onload=start;

script.onerror=
 function(){
  alert(
   "Supabase library load failed"
  );
 };

document.head.appendChild(
 script
);

})();
</script>

</body>
</html>
