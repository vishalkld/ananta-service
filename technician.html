te-columns:1fr}}

var sb,user,tech,centerId="",centerName="",DATA={complaints:[],txns:[],catalog:[],companies:[],technicians:[],private_chats:[],gps_logs:[]},lang=localStorage.getItem("ananta_tech_lang")||"en",tab="home",timer=null,channel=null;

function t(k){return(T[lang]||T.en)[k]||k}function n(v){return String(v==null?"":v).trim().toLowerCase()}function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function uid(){return "TX"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function toast(x){alert(x)}

function loadLib(cb){if(window.supabase?.createClient){cb();return}var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=()=>cb();s.onerror=()=>cb(new Error('Supabase library load failed'));document.head.appendChild(s)}

function loginPage(msg){root.innerHTML='<div class="wrap"><div class="card login"><h1>Ananta Enterprises</h1><div class="muted">Service Center</div><h2>'+t('login')+'</h2><label>'+t('email')+'</label><input id="le" type="email"><label>'+t('password')+'</label><input id="lp" type="password"><br><div class="row"><button onclick="doLogin()">'+t('loginBtn')+'</button><button class="secondary" onclick="switchLang()">'+(lang==='hi'?'English':'हिंदी')+'</button></div><p class="error">'+esc(msg||'')+'</p></div></div>'}

window.switchLang=()=>{lang=lang==='hi'?'en':'hi';localStorage.setItem('ananta_tech_lang',lang);user?render():loginPage('')};window.logout=()=>sb.auth.signOut().then(()=>{user=null;loginPage('')});

window.doLogin=async()=>{
  var e=le.value.trim(),p=lp.value;
  if(!e||!p){loginPage('Email और password required');return}
  var btn=document.querySelector('.login button');
  try{
    if(btn){btn.disabled=true;btn.textContent='...'}
    var r=await sb.auth.signInWithPassword({email:e,password:p});
    if(r.error){loginPage(r.error.message);return}
    await boot();
  }catch(err){
    // Any unexpected failure during login/boot must show a clear message,
    // not just silently look like "login failed" when auth actually succeeded.
    loginPage('Login ke baad data load nahi hua: '+(err&&err.message||err));
  }
};

async function invoke(body){
  var s=await sb.auth.getSession();
  if(s.error||!s.data.session)throw Error('Login session expire ho gaya');
  var r=await sb.functions.invoke('manage-complaint-sync',{body,headers:{Authorization:'Bearer '+s.data.session.access_token,apikey:KEY}});
  if(r.error)throw Error((r.data&&r.data.error)||r.error.message||'Edge Function request failed');
  if(!r.data?.success)throw Error(r.data?.error||'Operation failed');
  return r.data;
}

async function boot(){
  try{
    var s=await sb.auth.getSession();
    if(!s.data.session){loginPage('');return}
    user=s.data.session.user;
    var tr=await sb.from('technicians').select('id,name,email,phone,technician_code,auth_user_id,service_center_id,is_active').eq('auth_user_id',user.id).limit(1).maybeSingle();
    if(tr.error||!tr.data)throw Error(tr.error?.message||'Technician record नहीं मिला — is account ko Technicians list me link nahi kiya gaya. Service Center se contact karein.');
    tech=tr.data;
    if(tech.is_active===false)throw Error('Technician account inactive है');
    centerId=String(tech.service_center_id||'');
    if(!centerId)throw Error('Technician Service Center link missing');
    /* IMPORTANT: Do NOT query service_centers from browser here. RLS may block the technician. The Edge Function uses service-role access. */
    centerName=tech.service_center_name||tech.serviceCenterName||'Service Center';
    // NOTE: loadData() below no longer throws on partial failure — it records
    // warnings instead, so a single Edge Function or RLS hiccup does not bounce
    // the technician back to the login screen.
    await loadData();
    startSync();
    render();
  }catch(e){
    loginPage(e.message);
  }
}

async function loadData(){
  warnings=[];
  var edge=null,direct=null;

  // 1) Complaints via Edge Function (service-role, bypasses RLS)
  try{
    edge=await invoke({action:'read'});
  }catch(err){
    console.error('Edge Function read failed',err);
    warnings.push((lang==='hi'?'Live complaint sync fail hua: ':'Live complaint sync failed: ')+err.message+(lang==='hi'?' — Start/Close tab tak kaam nahi karega jab tak ye theek na ho.':' — Start/Close will not work until this is fixed.'));
  }

  // 2) Everything else via direct table read (txns, catalog, companies, stock).
  //    If RLS blocks this for the technician role, we surface a clear warning
  //    instead of silently showing an empty stock list.
  try{
    var r=await sb.from('app_data').select('id,data,updated_at').eq('service_center_id',centerId).order('updated_at',{ascending:false}).limit(1).maybeSingle();
    if(r.error) throw Error(r.error.message);
    if(!r.data) throw Error('No app_data row found for this Service Center');
    direct=r.data;
  }catch(err){
    console.error('Direct app_data read failed',err);
    warnings.push((lang==='hi'?'Stock/Catalog data load nahi hua: ':'Stock/Catalog data failed to load: ')+err.message+(lang==='hi'?' — Ye aksar Supabase RLS policy ki wajah se hota hai. Service Center se check karayein ki technicians ko app_data table par SELECT allow hai.':' — This is usually a Supabase RLS policy issue. Ask the Service Center to confirm technicians have SELECT access on the app_data table.'));
  }

  var d=direct?.data||{};
  DATA={
    companies:Array.isArray(d.companies)?d.companies:[],
    catalog:Array.isArray(d.catalog)?d.catalog:[],
    technicians:Array.isArray(d.technicians)?d.technicians:[],
    complaints:Array.isArray(edge?.complaints)?edge.complaints:(Array.isArray(d.complaints)?d.complaints:[]),
    txns:Array.isArray(d.txns)?d.txns:[],
    private_chats:Array.isArray(d.private_chats)?d.private_chats:[],
    gps_logs:Array.isArray(d.gps_logs)?d.gps_logs:[],
    updated_at:edge?.updated_at||direct?.updated_at||null
  };
  return DATA;
}

function mine(c){var ids=[c.technician_auth_user_id,c.technicianAuthUserId,c.tech_auth_user_id,c.auth_user_id,c.technician_user_id,c.technician_id,c.technicianId,c.tech_id,c.assigned_technician_id,c.assigned_to_id].filter(Boolean).map(n);if(ids.includes(n(user.id))||ids.includes(n(tech.id)))return true;var vals=[c.technician,c.technician_name,c.technicianName,c.tech,c.tech_name,c.assigned_technician,c.assigned_to,c.technician_code,c.technicianCode,c.tech_code,c.technician_email,c.technician_phone].filter(Boolean).map(n);return [n(tech.name),n(tech.technician_code),n(tech.email||user.email),n(tech.phone)].filter(Boolean).some(x=>vals.includes(x))}

function cs(){return DATA.complaints.filter(mine)}

function txnMine(x){var ids=[x.technician_auth_user_id,x.technicianAuthUserId,x.tech_auth_user_id,x.auth_user_id,x.technician_user_id,x.technician_id,x.technicianId,x.tech_id].filter(Boolean).map(n);if(ids.length)return ids.includes(n(user.id))||ids.includes(n(tech.id));return n(x.technician||x.technician_name||x.tech)===n(tech.name)}

function stockRows(){var m={};(DATA.txns||[]).forEach(x=>{if(!txnMine(x))return;var p=String(x.partNo||x.part_no||x.spare_part_no||x.part_number||x.spare_part_code||'');if(!p)return;var co=x.company||'',pr=x.product||'',mo=x.model||'',pn=x.partName||x.part_name||x.spare_part_name||'',k=[n(co),n(pr),n(mo),n(p)].join('|');m[k]??={company:co,product:pr,model:mo,partNo:p,partName:pn,fresh:0,defective:0};var q=Number(x.qty??x.quantity??0),ty=n(x.type||x.transaction_type||x.txn_type||x.action).replace(/[- ]/g,'_');if(['issue','stock_issue','technician_issue','transfer_to_technician','transfer','allocate','allocated','received','receive'].includes(ty))m[k].fresh+=q;if(['use','consume','consumed','used'].includes(ty)){m[k].fresh-=q;m[k].defective+=q}if(['collect','defective_return','return_to_service_center','return'].includes(ty))m[k].defective-=q});return Object.values(m).filter(x=>x.fresh>0||x.defective>0)}

function status(c){return String(c.status||'ASSIGNED').toUpperCase()}

function complaintCard(c){var st=status(c),b='';if(st==='ASSIGNED')b+='<button onclick="startJob(\''+esc(c.id)+'\')">'+t('start')+'</button>';if(st!=='CLOSED'&&st!=='CANCELLED')b+='<button class="secondary" onclick="consume(\''+esc(c.id)+'\')">'+t('consume')+'</button><button onclick="closeJob(\''+esc(c.id)+'\')">'+t('close')+'</button>';return '<div class="item"><div class="row" style="justify-content:space-between"><div><b>'+esc(c.companyComplaintNo||c.complaintNo||'Complaint')+'</b> <span class="badge">'+esc(c.status||'')+'</span></div><button class="secondary" onclick="viewComplaint(\''+esc(c.id)+'\')">View</button></div><p>'+t('company')+': '+esc(c.company||'')+'</p><p>'+t('customer')+': '+esc(c.customer||c.customerName||'')+' · '+esc(c.mobile||c.phone||c.customerMobile||'')+'</p><p>'+t('product')+': '+esc(c.product||'')+' · '+t('model')+': '+esc(c.model||'')+'</p><p>'+t('ref')+': '+esc(c.serviceCenterRef||c.service_center_ref||'')+'</p><div class="row">'+b+'</div></div>'}

function warnBar(){if(!warnings.length)return'';return '<div class="warnbar">⚠ '+warnings.map(esc).join('<br>⚠ ')+'</div>'}

function home(){var a=cs(),st=stockRows();return warnBar()+'<div class="statrow"><div class="stat"><b>'+a.filter(c=>status(c)==='ASSIGNED').length+'</b><span>'+t('assigned')+'</span></div><div class="stat"><b>'+a.filter(c=>status(c)==='IN PROGRESS').length+'</b><span>'+t('progress')+'</span></div><div class="stat"><b>'+a.filter(c=>status(c)==='CLOSED').length+'</b><span>'+t('closed')+'</span></div></div><div class="card"><h2>'+t('complaints')+'</h2>'+(a.length?a.slice(0,6).map(complaintCard).join(''):'<p class="muted">'+t('no')+'</p>')+'</div><div class="card"><h2>'+t('stock')+'</h2><div class="statrow"><div class="stat"><b>'+st.reduce((a,x)=>a+x.fresh,0)+'</b><span>'+t('fresh')+'</span></div><div class="stat"><b>'+st.reduce((a,x)=>a+x.defective,0)+'</b><span>'+t('defective')+'</span></div><div class="stat"><b>'+st.length+'</b><span>'+t('part')+'</span></div></div></div>'}

function complaintsPage(){var a=cs();return warnBar()+'<div class="card"><h2>'+t('complaints')+'</h2><input id="cq" placeholder="Complaint / Customer / Mobile" oninput="filterC()"><div id="clist">'+(a.length?a.map(complaintCard).join(''):'<p class="muted">'+t('no')+'</p>')+'</div></div>'}window.filterC=()=>{var q=n(cq.value),a=cs().filter(c=>!q||[c.companyComplaintNo,c.customer,c.mobile,c.product,c.model].some(v=>n(v).includes(q)));clist.innerHTML=a.length?a.map(complaintCard).join(''):'<p class="muted">'+t('no')+'</p>'}

function stockPage(){var st=stockRows(),co=[...new Set(st.map(x=>x.company).filter(Boolean))];return warnBar()+'<div class="card"><h2>'+t('stock')+'</h2><select id="sco" onchange="filterS()"><option value="">'+t('all')+'</option>'+co.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><div class="grid"><select id="spr" onchange="filterS()"><option value="">'+t('all')+'</option></select><select id="smo" onchange="filterS()"><option value="">'+t('all')+'</option></select></div><input id="sq" oninput="filterS()" placeholder="Part No / Part Name"><div id="slist" style="overflow:auto">'+stockTable(st)+'</div></div>'}function stockTable(st){return st.length?'<table><tr><th>'+t('company')+'</th><th>'+t('product')+'</th><th>'+t('model')+'</th><th>'+t('part')+'</th><th>'+t('fresh')+'</th><th>'+t('defective')+'</th></tr>'+st.map(x=>'<tr><td>'+esc(x.company)+'</td><td>'+esc(x.product)+'</td><td>'+esc(x.model)+'</td><td>'+esc(x.partNo)+' - '+esc(x.partName)+'</td><td>'+x.fresh+'</td><td>'+x.defective+'</td></tr>').join('')+'</table>':'<p class="muted">'+t('no')+'</p>'}

window.filterS=()=>{var st=stockRows(),co=sco.value,pr=spr.value,mo=smo.value,q=n(sq.value),f=st.filter(x=>(!co||x.company===co)&&(!pr||x.product===pr)&&(!mo||x.model===mo)&&(!q||n(x.partNo+' '+x.partName).includes(q)));slist.innerHTML=stockTable(f);var ps=[...new Set(st.filter(x=>!co||x.company===co).map(x=>x.product).filter(Boolean))],ms=[...new Set(st.filter(x=>(!co||x.company===co)&&(!pr||x.product===pr)).map(x=>x.model).filter(Boolean))];spr.innerHTML='<option value="">'+t('all')+'</option>'+ps.map(x=>'<option>'+esc(x)+'</option>').join('');spr.value=ps.includes(pr)?pr:'';smo.innerHTML='<option value="">'+t('all')+'</option>'+ms.map(x=>'<option>'+esc(x)+'</option>').join('');smo.value=ms.includes(mo)?mo:''}

function tracking(){return warnBar()+'<div class="card"><h2>'+t('tracking')+'</h2><p class="muted">GPS location capture.</p><div class="row"><button onclick="gps(\'CHECK_IN\')">Check In</button><button class="secondary" onclick="gps(\'GET_GPS\')">Get GPS</button><button class="danger" onclick="gps(\'CHECK_OUT\')">Check Out</button></div><div id="gpsout" class="item">—</div></div>'}window.gps=type=>{if(!navigator.geolocation){toast('GPS supported नहीं है');return}navigator.geolocation.getCurrentPosition(async p=>{var x={id:uid(),type,technician:tech.name,auth_user_id:user.id,service_center_id:centerId,latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,timestamp:new Date().toISOString()};try{var r=await sb.from('app_data').select('id,data').eq('service_center_id',centerId).limit(1).maybeSingle();if(!r.error&&r.data){var d=r.data.data||{};d.gps_logs=Array.isArray(d.gps_logs)?d.gps_logs:[];d.gps_logs.push(x);await sb.from('app_data').update({data:d,updated_at:new Date().toISOString()}).eq('id',r.data.id)}else if(r.error){console.error('GPS save failed (RLS?)',r.error)}}catch(e){console.error('GPS save failed',e)}gpsout.textContent=type+' : '+p.coords.latitude+', '+p.coords.longitude},e=>toast('GPS: '+e.message),{enableHighAccuracy:true,timeout:15000,maximumAge:0})}

function chat(){var a=DATA.private_chats||[];return warnBar()+'<div class="card"><h2>'+t('chat')+'</h2><div>'+a.slice(-30).map(x=>'<div class="item"><b>'+esc(x.sender_type||'')+'</b><br>'+esc(x.message||'')+'<div class="muted">'+esc(x.created_at||'')+'</div></div>').join('')+'</div><textarea id="msg" placeholder="'+t('chatPlaceholder')+'"></textarea><br><button onclick="sendChat()">'+t('send')+'</button></div>'}window.sendChat=async()=>{var m=(msg.value||'').trim();if(!m)return;try{var r=await sb.from('app_data').select('id,data').eq('service_center_id',centerId).limit(1).maybeSingle();if(r.error||!r.data)throw Error('Service Center data unavailable (RLS ya connection issue)');var d=r.data.data||{};d.private_chats=Array.isArray(d.private_chats)?d.private_chats:[];d.private_chats.push({id:uid(),service_center_id:centerId,technician_auth_user_id:user.id,sender_auth_user_id:user.id,sender_type:'TECHNICIAN',message:m,created_at:new Date().toISOString(),read_by_service_center:false});var u=await sb.from('app_data').update({data:d,updated_at:new Date().toISOString()}).eq('id',r.data.id);if(u.error)throw Error(u.error.message);await loadData();render()}catch(e){toast('Chat save failed: '+e.message)}}

window.startJob=async cid=>{try{var c=DATA.complaints.find(x=>String(x.id)===String(cid));if(!c)throw Error('Complaint not found');if(['CLOSED','CANCELLED'].includes(status(c)))throw Error('Complaint cannot be started');var r=await invoke({action:'start',complaint_id:String(cid),startedAt:new Date().toISOStr
