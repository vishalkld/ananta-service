<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2f5d4f"><title>Ananta Technician Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f3;color:#23352e;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:#2f5d4f;color:#fff;padding:14px;position:sticky;top:0;z-index:5}.head,.wrap{max-width:900px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:19px;margin:0}.muted{font-size:12px;opacity:.8}.wrap{padding:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab,.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;cursor:pointer}.tab{background:#fff;color:#2f5d4f}.tab.active,.btn{background:#2f5d4f;color:#fff}.btn.secondary{background:#e8eeea;color:#2f5d4f}.btn.danger{background:#a63b32;color:#fff}.card{background:#fff;border:1px solid #dde4df;border-radius:12px;padding:13px;margin-bottom:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd6d0;border-radius:8px;font:inherit}textarea{min-height:70px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.statbox{background:#f1f6f3;border-radius:9px;padding:10px;text-align:center}.statbox b{display:block;font-size:21px}.item{border:1px solid #e0e5e1;border-radius:9px;padding:10px;margin-top:8px}.item h3{font-size:14px;margin:0 0 5px}.item p{font-size:12px;margin:4px 0;color:#53635c}.badge{display:inline-block;padding:3px 7px;border-radius:18px;font-size:10px;font-weight:800;background:#e8eeea}.assigned{background:#fff0cf}.progress{background:#e5efff}.closed{background:#e0f3e8}.photo{max-width:110px;max-height:90px;border-radius:7px;margin:4px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.login .card{max-width:420px;width:100%}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#243b32;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:20}</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const URL="https://talzqxwoclrllbqudpkk.supabase.co",KEY="sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk",db=window.supabase.createClient(URL,KEY);let user,centerId,centerName,DB,tab="home",lang=localStorage.getItem("ananta_lang")||"en";
const I={en:{dash:"Dashboard",comp:"My Complaints",stock:"My Inventory",logout:"Logout",refresh:"Refresh",assigned:"Assigned",progress:"In Progress",closed:"Closed",fresh:"Fresh",def:"Defective",none:"No records.",start:"Start Job",use:"Use Spare Part",close:"Close Complaint",part:"Part",qty:"Quantity",photo:"Photo",remark:"Remark",save:"Save",ref:"Service Center Ref.",company:"Company",customer:"Customer",mobile:"Mobile",address:"Address",product:"Product",model:"Model"},hi:{dash:"डैशबोर्ड",comp:"मेरी शिकायतें",stock:"मेरा स्टॉक",logout:"लॉगआउट",refresh:"रीफ्रेश",assigned:"ASSIGNED",progress:"IN PROGRESS",closed:"CLOSED",fresh:"Fresh",def:"Defective",none:"कोई रिकॉर्ड नहीं।",start:"काम शुरू करें",use:"स्पेयर पार्ट उपयोग करें",close:"शिकायत बंद करें",part:"पार्ट",qty:"मात्रा",photo:"फोटो",remark:"नोट",save:"सेव करें",ref:"सर्विस सेंटर रेफ.",company:"कंपनी",customer:"ग्राहक",mobile:"मोबाइल",address:"पता",product:"प्रोडक्ट",model:"मॉडल"}};const t=k=>I[lang][k]||k,esc=x=>String(x??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const uid=()=>"x"+Math.random().toString(36).slice(2)+Date.now().toString(36),today=()=>new Date().toISOString().slice(0,10);function toast(x){let e=document.getElementById("toast");e.textContent=x;e.style.display="block";setTimeout(()=>e.style.display="none",2500)}function norm(d){d=d||{};for(const k of ["companies","catalog","technicians","complaints","txns"])d[k]=d[k]||[];return d}
async function load(){let r=await db.from("app_data").select("data").eq("service_center_id",centerId).limit(1);if(r.error)throw r.error;DB=norm(r.data?.[0]?.data)}async function save(){let snap=JSON.parse(JSON.stringify(DB)),q=await db.from("app_data").select("service_center_id").eq("service_center_id",centerId).limit(1);if(q.error)throw q.error;let p={data:snap,updated_at:new Date().toISOString()};let r=q.data?.length?await db.from("app_data").update(p).eq("service_center_id",centerId):await db.from("app_data").insert({service_center_id:centerId,...p});if(r.error)throw r.error}
function tech(){return user.user_metadata?.technician_name||user.email}function fs(){let m={};DB.txns.forEach(x=>{if(x.tech!==tech())return;let k=x.company+"|"+x.partNo;m[k]??={company:x.company,partNo:x.partNo,partName:x.partName,product:x.product,model:x.model||"",qty:0};if(x.type==="issue")m[k].qty+=+x.qty;if(x.type==="use")m[k].qty-=+x.qty});return Object.values(m).filter(x=>x.qty>0)}function ds(){let m={};DB.txns.forEach(x=>{if(x.tech!==tech())return;let k=x.company+"|"+x.partNo;m[k]??={company:x.company,partNo:x.partNo,partName:x.partName,product:x.product,model:x.model||"",qty:0};if(x.type==="use")m[k].qty+=+x.qty;if(x.type==="collect")m[k].qty-=+x.qty});return Object.values(m).filter(x=>x.qty>0)}
function badge(s){return `<span class="badge ${s==='ASSIGNED'?'assigned':s==='IN PROGRESS'?'progress':'closed'}">${esc(s)}</span>`}function cards(a){return a.map(c=>`<div class="item"><h3>${esc(c.companyComplaintNo)} ${badge(c.status)}</h3><p><b>${t('ref')}:</b> ${esc(c.serviceCenterRef)}</p><p><b>${t('company')}:</b> ${esc(c.company)} · <b>${t('customer')}:</b> ${esc(c.customer)} · ${esc(c.mobile)}</p><p><b>${t('address')}:</b> ${esc(c.address)}</p><p><b>${t('product')}:</b> ${esc(c.product)} ${esc(c.model)}</p>${(c.attachments||[]).map(a=>a.data?`<img class="photo" src="${a.data}">`:"").join("")}<div class="row">${c.status==='ASSIGNED'?`<button class="btn" onclick="start('${c.id}')">${t('start')}</button>`:""}${c.status!=='CLOSED'&&c.status!=='CANCELLED'?`<button class="btn secondary" onclick="use('${c.id}')">${t('use')}</button><button class="btn" onclick="closeC('${c.id}')">${t('close')}</button>`:""}</div></div>`).join("")||`<p>${t('none')}</p>`)}
function render(){let a=DB.complaints.filter(c=>String(c.technician||'').toLowerCase()===String(tech()).toLowerCase()),f=fs(),d=ds();document.getElementById('app').innerHTML=`<header><div class="head"><div><h1>Ananta Technician</h1><div class="muted">${esc(centerName)} · ${esc(tech())}</div></div><div class="row"><button class="btn secondary" onclick="lang=lang==='hi'?'en':'hi';localStorage.setItem('ananta_lang',lang);render()">${lang==='hi'?'English':'हिंदी'}</button><button class="btn danger" onclick="logout()">${t('logout')}</button></div></div></header><main class="wrap"><div class="tabs"><button class="tab ${tab==='home'?'active':''}" onclick="tab='home';render()">${t('dash')}</button><button class="tab ${tab==='comp'?'active':''}" onclick="tab='comp';render()">${t('comp')}</button><button class="tab ${tab==='stock'?'active':''}" onclick="tab='stock';render()">${t('stock')}</button><button class="tab" onclick="load().then(render)">${t('refresh')}</button></div>${tab==='home'?`<div class="card"><div class="stat"><div class="statbox"><b>${a.filter(x=>x.status==='ASSIGNED').length}</b>${t('assigned')}</div><div class="statbox"><b>${a.filter(x=>x.status==='IN PROGRESS').length}</b>${t('progress')}</div><div class="statbox"><b>${a.filter(x=>x.status==='CLOSED').length}</b>${t('closed')}</div></div></div><div class="card"><h2>${t('comp')}</h2>${cards(a.slice(0,5))}</div>`:tab==='comp'?`<div class="card"><h2>${t('comp')}</h2>${cards(a)}</div>`:`<div class="card"><h2>${t('fresh')}</h2>${f.map(x=>`<div class="item"><b>${esc(x.product)} ${esc(x.model)}</b><p>${esc(x.partNo)} — ${esc(x.partName)} · ${x.qty}</p></div>`).join('')||`<p>${t('none')}</p>`}</div><div class="card"><h2>${t('def')}</h2>${d.map(x=>`<div class="item"><b>${esc(x.product)} ${esc(x.model)}</b><p>${esc(x.partNo)} — ${esc(x.partName)} · ${x.qty}</p></div>`).join('')||`<p>${t('none')}</p>`}</div>`}</main>`}
async function fileData(f){if(!f)return null;return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok({name:f.name,data:r.result});r.onerror=no;r.readAsDataURL(f)})}function modal(s){document.body.insertAdjacentHTML('beforeend',s)}function use(cid){let c=DB.complaints.find(x=>x.id===cid),f=fs().filter(x=>x.company===c.company);modal(`<div class="login" id="m" style="position:fixed;inset:0;background:#0006;z-index:10"><div class="card"><h2>${t('use')}</h2><label>${t('part')}</label><select id="p">${f.map(x=>`<option value="${esc(x.partNo)}">${esc(x.partNo)} — ${esc(x.partName)} (Fresh ${x.qty})</option>`).join('')}</select><br><br><label>${t('qty')}</label><input id="q" type="number" min="1" value="1"><br><br><label>${t('photo')}</label><input id="ph" type="file" accept="image/*" capture="environment"><br><br><label>${t('remark')}</label><textarea id="r"></textarea><br><button class="btn" onclick="useSave('${cid}')">${t('save')}</button> <button class="btn secondary" onclick="m.remove()">Cancel</button></div></div>`)}async function useSave(cid){let c=DB.complaints.find(x=>x.id===cid),pn=p.value,n=+q.value,s=fs().find(x=>x.company===c.company&&x.partNo===pn);if(!s||n<1||n>s.qty)return toast('Invalid quantity');let z=DB.catalog.find(x=>x.company===c.company&&x.partNo===pn)||s,ph=await fileData(document.getElementById('ph').files[0]);DB.txns.push({id:uid(),type:'use',date:today(),company:c.company,product:z.product,model:z.model||'',partNo:z.partNo,partName:z.partName,qty:n,tech:tech(),complaint:c.companyComplaintNo,customer:c.customer,remarks:r.value.trim(),photo:ph?.data||null,createdAt:new Date().toISOString()});c.status='IN PROGRESS';c.updatedAt=new Date().toISOString();try{await save();m.remove();toast('Saved');render()}catch(e){toast(e.message)}}async function start(id){let c=DB.complaints.find(x=>x.id===id);c.status='IN PROGRESS';c.updatedAt=new Date().toISOString();try{await save();render()}catch(e){toast(e.message)}}function closeC(cid){modal(`<div class="login" id="m" style="position:fixed;inset:0;background:#0006;z-index:10"><div class="card"><h2>${t('close')}</h2><label>${t('photo')}</label><input id="cf" type="file" accept="image/*" capture="environment"><br><br><label>${t('remark')}</label><textarea id="cr"></textarea><br><button class="btn" onclick="closeSave('${cid}')">${t('save')}</button> <button class="btn secondary" onclick="m.remove()">Cancel</button></div></div>`)}async function closeSave(cid){let c=DB.complaints.find(x=>x.id===cid),ph=await fileData(cf.files[0]);c.technicianRemark=cr.value.trim();c.closeRemark=c.technicianRemark;if(ph)c.attachments=(c.attachments||[]).concat([ph]);c.status='CLOSED';c.closedAt=new Date().toISOString();c.updatedAt=new Date().toISOString();try{await save();m.remove();toast('Complaint closed');render()}catch(e){toast(e.message)}}async function logout(){await db.auth.signOut();location.reload()}
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="card"><h2>Ananta Technician Login</h2><label>Email</label><input id="e" type="email"><br><br><label>Password</label><input id="pw" type="password"><br><br><button class="btn" onclick="doLogin()">Login</button><p id="err" class="muted"></p></div></div>`}async function doLogin(){let r=await db.auth.signInWithPassword({email:e.value.trim(),password:pw.value});if(r.error)err.textContent=r.error.message;else location.reload()}
async function init(){let s=await db.auth.getSession();if(!s.data.session){login();return}user=s.data.session.user;let m=user.user_metadata||{},a=user.app_metadata||{};if(String(m.role||a.role||'').toUpperCase()!=='TECHNICIAN'){document.getElementById('app').innerHTML='<div class="login"><div class="card"><h2>Access Denied</h2><p>This page is for Technician accounts.</p><button class="btn danger" onclick="logout()">Logout</button></div></div>';return}centerId=m.service_center_id||a.service_center_id;if(!centerId){toast('service_center_id missing');return}let c=await db.from('service_centers').select('id,name').eq('id',centerId).maybeSingle();if(c.error||!c.data){toast('Service Center link not found');return}centerName=c.data.name;try{await load();render()}catch(e){toast('Database error: '+e.message)}}db.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'||!s)location.reload()});init();
