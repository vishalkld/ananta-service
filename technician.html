<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ananta Technician</title>
<style>
body{margin:0;background:#f4f6f4;color:#20352d;font-family:Arial,sans-serif}*{box-sizing:border-box}
.wrap{max-width:950px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dce4df;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}
h1{margin:0 0 4px;font-size:21px}h2{font-size:18px}label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd6d0;border-radius:8px;font:inherit;background:#fff}textarea{min-height:75px}
button{border:0;border-radius:8px;padding:10px 13px;background:#2f5d4f;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e7eeea;color:#2f5d4f}.danger{background:#a43b32}
.row{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#eef4f0;border-radius:10px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:11px}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tab{white-space:nowrap}.tab.active{background:#173d31}
.item{border:1px solid #dce4df;border-radius:9px;padding:12px;margin:8px 0}.muted{font-size:12px;color:#607069}.badge{display:inline-block;padding:4px 8px;border-radius:18px;background:#e7eeea;font-size:10px;font-weight:800}
.error{color:#a43b32;font-weight:700}.hidden{display:none!important}.login{max-width:430px;margin:50px auto}.pill{background:#f1f5f2;padding:6px 9px;border-radius:20px;font-size:11px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:10px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
"use strict";
var URL="https://talzqxwoclrllbqudpkk.supabase.co";
var KEY="sb_publishable_6H_DB7Z-5ygiX2hvMvQwZQ_ma-o-mQk";
var sb=null,user=null,meta={},technicianRecord=null,technicianDisplayName="",centerId="",centerName="",DATA={},lang=localStorage.getItem("ananta_tech_lang")||"en",tab="home";

var TX={
en:{chat:"Private Chat",send:"Send",message:"Message",noMessages:"No messages yet.",chatPlaceholder:"Write a private message...",login:"Technician Login",email:"Email",password:"Password",loginBtn:"Login",logout:"Logout",dashboard:"Dashboard",complaints:"My Complaints",stock:"My Stock",tracking:"Attendance & GPS",company:"Company",all:"All",product:"Product",model:"Model",part:"Spare Part",fresh:"Fresh",defective:"Defective",assigned:"Assigned",progress:"In Progress",closed:"Closed",start:"Start Job",consume:"Consume Spare",close:"Close Complaint",checkin:"Check In",checkout:"Check Out",gps:"Get GPS",customer:"Customer",mobile:"Mobile",address:"Address",complaint:"Complaint No.",ref:"Service Center Ref.",status:"Status",qty:"Quantity",photo:"Photo",remark:"Remark",save:"Save",no:"No records found.",success:"Saved successfully.",permission:"Location permission is required.",service:"Service Center"},
hi:{chat:"प्राइवेट चैट",send:"भेजें",message:"मैसेज",noMessages:"अभी कोई मैसेज नहीं है।",chatPlaceholder:"प्राइवेट मैसेज लिखें...",login:"टेक्नीशियन लॉगिन",email:"ईमेल",password:"पासवर्ड",loginBtn:"लॉगिन",logout:"लॉगआउट",dashboard:"डैशबोर्ड",complaints:"मेरी शिकायतें",stock:"मेरा स्टॉक",tracking:"अटेंडेंस व GPS",company:"कंपनी",all:"सभी",product:"प्रोडक्ट",model:"मॉडल",part:"स्पेयर पार्ट",fresh:"Fresh स्टॉक",defective:"Defective स्टॉक",assigned:"आवंटित",progress:"काम जारी",closed:"बंद",start:"काम शुरू करें",consume:"स्पेयर उपयोग करें",close:"शिकायत बंद करें",checkin:"चेक-इन",checkout:"चेक-आउट",gps:"GPS लें",customer:"ग्राहक",mobile:"मोबाइल",address:"पता",complaint:"शिकायत नंबर",ref:"सर्विस सेंटर रेफ.",status:"स्थिति",qty:"मात्रा",photo:"फोटो",remark:"नोट",save:"सेव करें",no:"कोई रिकॉर्ड नहीं मिला।",success:"सफलतापूर्वक सेव हुआ।",permission:"Location permission जरूरी है।",service:"सर्विस सेंटर"}
};
function t(k){return (TX[lang]||TX.en)[k]||k}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function id(){return "TX"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(s){alert(s)}
function loadLib(cb){
 if(window.supabase&&window.supabase.createClient){cb(null);return}
 var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
 s.onload=function(){cb(window.supabase&&window.supabase.createClient?null:new Error("Supabase library unavailable"))};
 s.onerror=function(){cb(new Error("Supabase library load failed"))};document.head.appendChild(s)
}
function loginPage(msg){
 document.getElementById("root").innerHTML='<div class="wrap"><div class="card login">'+
 '<h1>Ananta Enterprises</h1><div class="muted">'+t("service")+'</div><h2>'+t("login")+'</h2>'+
 '<label>'+t("email")+'</label><input id="email" type="email" autocomplete="username">'+
 '<label>'+t("password")+'</label><input id="pass" type="password" autocomplete="current-password">'+
 '<br><br><div class="row"><button onclick="doLogin()">'+t("loginBtn")+'</button><button class="secondary" onclick="switchLang()">'+(lang==="hi"?"English":"हिंदी")+'</button></div>'+
 '<p id="err" class="error">'+esc(msg||"")+'</p></div></div>'
}
window.switchLang=function(){lang=lang==="hi"?"en":"hi";localStorage.setItem("ananta_tech_lang",lang);if(user)render();else loginPage("")};
window.doLogin=function(){
 var e=document.getElementById("email").value.trim(),p=document.getElementById("pass").value;
 if(!e||!p){document.getElementById("err").textContent="Email और password required";return}
 sb.auth.signInWithPassword({email:e,password:p}).then(function(r){if(r.error){document.getElementById("err").textContent=r.error.message;return}boot()})
};
window.logout=function(){sb.auth.signOut().then(function(){user=null;loginPage("")})};

function boot(){
 sb.auth.getSession().then(function(r){
  if(!r.data.session){loginPage("");return}
  user=r.data.session.user;meta=user.user_metadata||{};
  var role=String(meta.role||(user.app_metadata||{}).role||"").toUpperCase();
  if(role && role!=="TECHNICIAN"){loginPage("यह Technician account नहीं है.");sb.auth.signOut();return}
  centerId=meta.service_center_id||(user.app_metadata||{}).service_center_id||"";
  if(!centerId){loginPage("Technician account में Service Center link नहीं मिला.");return}
  sb.from("technicians").select("id,name,email,phone,technician_code,service_center_id,is_active").eq("auth_user_id",user.id).maybeSingle().then(function(tr){
   if(tr.error){loginPage("Technician record नहीं मिला: "+tr.error.message);return}
   if(!tr.data){loginPage("इस Supabase login का technician record नहीं मिला.");return}
   technicianRecord=tr.data;
   technicianDisplayName=tr.data.name||meta.technician_name||meta.name||user.email;
   centerId=tr.data.service_center_id||centerId;
   return sb.from("service_centers").select("id,name,service_center_code").eq("id",centerId).maybeSingle();
  }).then(function(r){
   if(!r)return;
   if(r.error){loginPage("Service Center load error: "+r.error.message);return}
   centerName=(r.data&&r.data.name)||"Service Center";
   loadData().then(render).catch(function(e){renderError(e.message)})
  }).catch(function(e){loginPage(e.message)})
 })
}
async function loadData(){
 var r=await sb.from("app_data").select("data").eq("service_center_id",centerId).limit(1);
 if(r.error)throw r.error;
 DATA=(r.data&&r.data[0]&&r.data[0].data)||{};
 DATA.complaints=Array.isArray(DATA.complaints)?DATA.complaints:[];
 DATA.txns=Array.isArray(DATA.txns)?DATA.txns:[];
 DATA.catalog=Array.isArray(DATA.catalog)?DATA.catalog:[];
 DATA.companies=Array.isArray(DATA.companies)?DATA.companies:[];
}
async function saveData(){
 var now=new Date().toISOString();
 var payload={data:DATA,updated_at:now};
 var q=await sb.from("app_data").select("service_center_id").eq("service_center_id",centerId).limit(1);
 if(q.error)throw q.error;
 if(q.data&&q.data.length){
  var u=await sb.from("app_data").update(payload).eq("service_center_id",centerId);
  if(u.error)throw u.error;
 }else{
  var i=await sb.from("app_data").insert({service_center_id:centerId,data:DATA,updated_at:now});
  if(i.error)throw i.error;
 }
}

function techName(){return technicianDisplayName||((technicianRecord&&technicianRecord.name)||meta.technician_name||meta.name||user.email)}
function myComplaints(){
 return DATA.complaints.filter(function(c){return String(c.technician||"").toLowerCase()===String(techName()).toLowerCase()})
}
function stockRows(){
 var m={};
 DATA.txns.forEach(function(x){
  if(x.tech_auth_user_id && String(x.tech_auth_user_id)!==String(user.id))return; if(!x.tech_auth_user_id && String(x.tech||"").toLowerCase()!==String(techName()).toLowerCase())return;
  var k=[x.company,x.product,x.model,x.partNo].join("|");
  if(!m[k])m[k]={company:x.company||"",product:x.product||"",model:x.model||"",partNo:x.partNo||"",partName:x.partName||"",fresh:0,defective:0};
  var q=Number(x.qty||0);
  if(x.type==="issue")m[k].fresh+=q;
  if(x.type==="use"){m[k].fresh-=q;m[k].defective+=q}
  if(x.type==="collect")m[k].defective-=q;
 });
 return Object.values(m).filter(function(x){return x.fresh>0||x.defective>0})
}
function render(){
 var cs=myComplaints(),st=stockRows();
 document.getElementById("root").innerHTML=
 '<div style="background:#2f5d4f;color:white"><div class="wrap"><div class="row" style="justify-content:space-between;align-items:center">'+
 '<div><h1>Ananta Technician</h1><div class="muted" style="color:#e5eee9">'+esc(centerName)+'</div></div>'+
 '<div class="row"><button class="secondary" onclick="switchLang()">'+(lang==="hi"?"English":"हिंदी")+'</button><button class="danger" onclick="logout()">'+t("logout")+'</button></div></div></div></div>'+
 '<main class="wrap"><div class="tabs row">'+
 '<button class="tab '+(tab==="home"?"active":"")+'" onclick="setTab(\'home\')">'+t("dashboard")+'</button>'+
 '<button class="tab '+(tab==="complaints"?"active":"")+'" onclick="setTab(\'complaints\')">'+t("complaints")+'</button>'+
 '<button class="tab '+(tab==="stock"?"active":"")+'" onclick="setTab(\'stock\')">'+t("stock")+'</button>'+
 '<button class="tab '+(tab==="tracking"?"active":"")+'" onclick="setTab(\'tracking\')">'+t("tracking")+'</button></div>'+
 (tab==="home"?home(cs,st):tab==="complaints"?complaints(cs):tab==="stock"?stock(st):chat())+'</main>'
}
function setTab(x){tab=x;render()}
window.setTab=setTab;
function home(cs,st){
 var a=cs.filter(c=>c.status==="ASSIGNED").length,p=cs.filter(c=>c.status==="IN PROGRESS").length,c=cs.filter(c=>c.status==="CLOSED").length;
 return '<div class="card"><h2>'+t("dashboard")+'</h2><div class="grid"><div class="stat"><b>'+a+'</b><span>'+t("assigned")+'</span></div><div class="stat"><b>'+p+'</b><span>'+t("progress")+'</span></div><div class="stat"><b>'+c+'</b><span>'+t("closed")+'</span></div></div></div>'+
 '<div class="card"><h2>'+t("complaints")+'</h2>'+companyComplaintList(cs)+'</div>'+
 '<div class="card"><h2>'+t("stock")+'</h2>'+stockTable(st)+'</div>'
}
function companySelect(list,idv){
 var companies=[];list.forEach(function(x){if(x.company&&companies.indexOf(x.company)<0)companies.push(x.company)});
 return '<select id="'+idv+'" onchange="filterCompany(this.value)"><option value="">'+t("all")+'</option>'+companies.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select>'
}
var selectedCompany="";
window.filterCompany=function(v){selectedCompany=v;render()};
function complaints(cs){
 var filtered=selectedCompany?cs.filter(c=>c.company===selectedCompany):cs;
 return '<div class="card"><h2>'+t("complaints")+'</h2><label>'+t("company")+'</label>'+companySelect(cs,"complaintCompany")+
 '<div id="complaintList">'+companyComplaintList(filtered)+'</div></div>'
}
function companyComplaintList(cs){
 if(!cs.length)return '<p class="muted">'+t("no")+'</p>';
 var groups={};cs.forEach(function(c){(groups[c.company||"Other"]||(groups[c.company||"Other"]=[])).push(c)});
 return Object.keys(groups).map(function(g){
  return '<div class="item"><b>'+esc(g)+'</b>'+groups[g].map(function(c){return '<div class="item"><b>'+esc(c.companyComplaintNo||t("complaint"))+'</b> <span class="badge">'+esc(c.status||"ASSIGNED")+'</span>'+
  '<p>'+t("customer")+': '+esc(c.customer||"")+' · '+esc(c.mobile||"")+'</p><p>'+t("product")+': '+esc(c.product||"")+' · '+t("model")+': '+esc(c.model||"")+'</p><p>'+t("ref")+': '+esc(c.serviceCenterRef||"")+'</p>'+
  '<div class="row">'+(c.status==="ASSIGNED"?'<button onclick="startJob(\''+esc(c.id)+'\')">'+t("start")+'</button>':"")+(c.status!=="CLOSED"&&c.status!=="CANCELLED"?'<button class="secondary" onclick="consume(\''+esc(c.id)+'\')">'+t("consume")+'</button><button onclick="closeJob(\''+esc(c.id)+'\')">'+t("close")+'</button>':"")+'</div></div>'}).join("")+'</div>'
 }).join("")
}
function stock(st){
 var companies=[];st.forEach(x=>{if(x.company&&companies.indexOf(x.company)<0)companies.push(x.company)});
 return '<div class="card"><h2>'+t("stock")+'</h2><label>'+t("company")+'</label><select id="sf" onchange="stockFilter()"><option value="">'+t("all")+'</option>'+companies.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select>'+
 '<div class="grid" style="margin-top:10px"><div><label>'+t("product")+'</label><select id="sp" onchange="stockFilter()"><option value="">'+t("all")+'</option></select></div><div><label>'+t("model")+'</label><select id="sm" onchange="stockFilter()"><option value="">'+t("all")+'</option></select></div><div><label>'+t("part")+'</label><input id="sq" oninput="stockFilter()" placeholder="'+t("part")+'"></div></div>'+
 '<div id="stockList" style="margin-top:10px">'+stockTable(st)+'</div></div>'
}
window.stockFilter=function(){
 var st=stockRows(),co=document.getElementById("sf").value,pr=document.getElementById("sp").value,mo=document.getElementById("sm").value,q=document.getElementById("sq").value.toLowerCase();
 var f=st.filter(x=>(!co||x.company===co)&&(!pr||x.product===pr)&&(!mo||x.model===mo)&&(!q||(x.partNo+" "+x.partName).toLowerCase().indexOf(q)>=0));
 document.getElementById("stockList").innerHTML=stockTable(f);
 var products=[],models=[];
 st.forEach(x=>{if((!co||x.company===co)&&x.product&&products.indexOf(x.product)<0)products.push(x.product);if((!co||x.company===co)&&(!pr||x.product===pr)&&x.model&&models.indexOf(x.model)<0)models.push(x.model)});
 document.getElementById("sp").innerHTML='<option value="">'+t("all")+'</option>'+products.map(x=>'<option>'+esc(x)+'</option>').join("");
 document.getElementById("sm").innerHTML='<option value="">'+t("all")+'</option>'+models.map(x=>'<option>'+esc(x)+'</option>').join("");
};
function stockTable(st){
 if(!st.length)return '<p class="muted">'+t("no")+'</p>';
 var groups={};st.forEach(function(x){(groups[x.company]||(groups[x.company]=[])).push(x)});
 return Object.keys(groups).map(function(g){return '<div class="item"><b>'+esc(g)+'</b>'+groups[g].map(function(x){
  return '<div class="item"><b>'+esc(x.product)+' · '+esc(x.model)+'</b><p>'+esc(x.partNo)+' — '+esc(x.partName)+'</p><span class="pill">'+t("fresh")+': '+x.fresh+'</span> <span class="pill">'+t("defective")+': '+x.defective+'</span></div>'
 }).join("")+'</div>'}).join("")
}

function chat(){
 var msgs=Array.isArray(DATA.private_chats)?DATA.private_chats:[];
 var mine=msgs.filter(function(m){return m.service_center_id===centerId&&(m.technician_auth_user_id===user.id||m.sender_auth_user_id===user.id||m.recipient_auth_user_id===user.id)});
 return '<div class="card"><h2>💬 '+t("chat")+'</h2><div style="max-height:55vh;overflow:auto">'+
 (mine.length?mine.map(function(m){var me=(m.sender_auth_user_id||m.auth_user_id)===user.id;return '<div class="item" style="margin-left:'+(me?"15%":"0")+';background:'+(me?"#eef4f0":"#fff")+'"><b>'+esc(me?"You":"Service Center")+'</b><p>'+esc(m.message||"")+'</p><span class="muted">'+esc(m.created_at||"")+'</span></div>'}).join(""):'<p class="muted">'+t("noMessages")+'</p>')+
 '</div><label>'+t("message")+'</label><textarea id="chatMsg" placeholder="'+t("chatPlaceholder")+'"></textarea><br><button onclick="sendChat()">'+t("send")+'</button></div>';
}
window.sendChat=function(){
 var box=document.getElementById("chatMsg"),message=(box?box.value:"").trim();if(!message)return;
 DATA.private_chats=Array.isArray(DATA.private_chats)?DATA.private_chats:[];
 DATA.private_chats.push({id:id(),service_center_id:centerId,technician_auth_user_id:user.id,sender_auth_user_id:user.id,sender_type:"TECHNICIAN",message:message,created_at:new Date().toISOString(),read_by_service_center:false});
 saveData().then(function(){toast(t("success"));render()}).catch(function(e){toast(e.message)});
};

function tracking(){
 return '<div class="card"><h2>'+t("tracking")+'</h2><p class="muted">'+t("checkin")+' / '+t("checkout")+' के समय GPS location save होगी। Complaint Start/Close पर भी location save होगी।</p><div class="row"><button onclick="gpsAction(\'CHECK_IN\')">'+t("checkin")+'</button><button class="secondary" onclick="gpsAction(\'GET_GPS\')">'+t("gps")+'</button><button class="danger" onclick="gpsAction(\'CHECK_OUT\')">'+t("checkout")+'</button></div><div id="gpsResult" class="item">—</div></div>'
}
function saveLocation(type,complaintId){
 return new Promise(function(resolve,reject){
  if(!navigator.geolocation){reject(new Error("GPS supported नहीं है"));return}
  navigator.geolocation.getCurrentPosition(function(pos){
   var x={id:id(),type:type,technician:techName(),auth_user_id:user.id,service_center_id:centerId,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString(),complaint_id:complaintId||null};
   DATA.gps_logs=Array.isArray(DATA.gps_logs)?DATA.gps_logs:[];DATA.gps_logs.push(x);
   saveData().then(function(){resolve(x)}).catch(reject);
  },function(e){reject(new Error(t("permission")+" "+e.message)),{enableHighAccuracy:true,timeout:15000,maximumAge:0}})
 })
}
window.gpsAction=function(type){ return; };
window.startJob=function(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});if(!c)return;
 c.status="IN PROGRESS";c.startedAt=c.startedAt||new Date().toISOString();c.updatedAt=new Date().toISOString();
 saveData().then(function(){return loadData()}).then(function(){toast(t("success"));render()}).catch(function(e){toast("Save failed: "+e.message)})
};

async function saveClosing(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});if(!c)return;
 var remark=document.getElementById("closeRemark").value.trim();
 var file=document.getElementById("closePhoto").files[0],photo=null;
 if(file)photo=await new Promise(function(resolve,reject){
  var r=new FileReader();r.onload=function(){resolve({name:file.name,data:r.result,type:file.type||"image"})};
  r.onerror=reject;r.readAsDataURL(file);
 });
 c.technicianRemark=remark;c.closeRemark=remark;c.status="CLOSED";c.closedAt=new Date().toISOString();c.updatedAt=new Date().toISOString();
 c.attachments=Array.isArray(c.attachments)?c.attachments:[];if(photo)c.attachments.push(photo);
 try{
  await saveData();await loadData();
  var saved=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
  if(!saved||saved.status!=="CLOSED")throw new Error("Complaint close could not be verified.");
  var m=document.getElementById("closeModal");if(m)m.remove();toast(t("success"));render();
 }catch(e){var er=document.getElementById("closeErr");if(er)er.textContent="Save failed: "+e.message}
}

window.consume=function(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
 if(!c){toast("Complaint not found");return}
 var st=stockRows().filter(function(x){return x.company===c.company&&x.fresh>0});
 if(!st.length){toast("इस company का fresh stock नहीं है।");return}
 var choices=st.map(function(x,i){return i+": "+x.partNo+" - "+x.partName+" ("+x.fresh+")"}).join("\n");
 var n=prompt(t("part")+" चुनें:\n"+choices+"\n\nNumber:","0");if(n===null)return;
 var p=st[Number(n)];if(!p){toast("Invalid part");return}
 var q=Number(prompt(t("qty"),"1"));if(!Number.isInteger(q)||q<1||q>p.fresh){toast("Invalid quantity");return}
 DATA.txns.push({id:id(),type:"use",date:new Date().toISOString().slice(0,10),company:p.company,product:p.product,model:p.model,partNo:p.partNo,partName:p.partName,qty:q,tech:techName(),tech_auth_user_id:user.id,service_center_id:centerId,complaint:c.companyComplaintNo,complaint_id:c.id,customer:c.customer,createdAt:new Date().toISOString()});
 c.status="IN PROGRESS";c.updatedAt=new Date().toISOString();
 saveData().then(function(){return loadData()}).then(function(){toast(t("success"));render()}).catch(function(e){toast("Consume save failed: "+e.message)})
};

function renderError(m){document.getElementById("root").innerHTML='<div class="wrap"><div class="card"><h2>Error</h2><p class="error">'+esc(m)+'</p><button onclick="location.reload()">Reload</button></div></div>'}
start();
