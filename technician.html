async function loadData(){
 if(!user||!centerId)throw new Error("Technician/Service Center session not ready");

 var r=await sb.from("app_data")
  .select("data,updated_at")
  .eq("service_center_id",centerId)
  .limit(1)
  .maybeSingle();

 if(r.error)throw new Error("Database read failed: "+r.error.message);

 DATA=(r.data&&r.data.data)||{};

 DATA.complaints=Array.isArray(DATA.complaints)?DATA.complaints:[];
 DATA.txns=Array.isArray(DATA.txns)?DATA.txns:[];
 DATA.catalog=Array.isArray(DATA.catalog)?DATA.catalog:[];
 DATA.companies=Array.isArray(DATA.companies)?DATA.companies:[];
 DATA.technicians=Array.isArray(DATA.technicians)?DATA.technicians:[];
 DATA.private_chats=Array.isArray(DATA.private_chats)?DATA.private_chats:[];
 DATA.updated_at=(r.data&&r.data.updated_at)||null;

 return DATA;
}

function mergeByUpdatedAt(serverArr, localArr){
 var sm=new Map(), out=[];
 (Array.isArray(serverArr)?serverArr:[]).forEach(function(x){if(x&&x.id!=null)sm.set(String(x.id),x);});
 (Array.isArray(localArr)?localArr:[]).forEach(function(x){
   if(!x||x.id==null){out.push(x);return}
   var k=String(x.id), old=sm.get(k);
   if(!old){sm.set(k,x);return}
   var sd=new Date(old.updatedAt||old.updated_at||old.createdAt||old.created_at||0).getTime();
   var ld=new Date(x.updatedAt||x.updated_at||x.createdAt||x.created_at||0).getTime();
   if(ld>=sd)sm.set(k,x);
 });
 sm.forEach(function(x){out.push(x)});
 return out;
}
function mergeTechnicianData(server, local){
 server=server||{};local=local||{};
 var merged=Object.assign({},server,local);
 /* Complaints: union + newest updatedAt wins. This prevents a stale
    technician snapshot from deleting a newly allocated complaint. */
 merged.complaints=mergeByUpdatedAt(server.complaints,local.complaints);
 /* Transactions/messages are append-only: union by id. */
 merged.txns=mergeByUpdatedAt(server.txns,local.txns);
 merged.private_chats=mergeByUpdatedAt(server.private_chats,local.private_chats);
 /* Keep server catalog/companies/technicians as the source of truth. */
 merged.catalog=Array.isArray(server.catalog)?server.catalog:(local.catalog||[]);
 merged.companies=Array.isArray(server.companies)?server.companies:(local.companies||[]);
 merged.technicians=Array.isArray(server.technicians)?server.technicians:(local.technicians||[]);
 return merged;
}
async function saveData(){
 var now=new Date().toISOString();

 async function attemptSave(){
  var latest=await sb.from("app_data")
    .select("data,updated_at")
    .eq("service_center_id",centerId)
    .order("updated_at",{ascending:false})
    .limit(1)
    .maybeSingle();

  if(latest.error)throw new Error("Database read before save failed: "+latest.error.message);
  if(!latest.data)throw new Error("Service Center database record not found.");

  var merged=mergeTechnicianData(latest.data.data,DATA);
  merged.updated_at=now;

  var q=sb.from("app_data")
    .update({data:merged,updated_at:now})
    .eq("service_center_id",centerId);

  /* Optimistic concurrency: update the same server version we just read. */
  if(latest.data.updated_at){
    q=q.eq("updated_at",latest.data.updated_at);
  }

  var u=await q.select("service_center_id,updated_at");
  if(u.error)throw new Error("Database update failed: "+u.error.message);

  /* Zero rows means another user saved between our read and write. */
  if(!u.data||!u.data.length)return false;

  DATA=merged;
  return true;
 }

 /* Retry once against the newest server snapshot on a write conflict. */
 var ok=await attemptSave();
 if(!ok)ok=await attemptSave();
 if(!ok)throw new Error("Database changed while saving. Please press Refresh and try again.");
 return true;
}
function techName(){return (technicianRecord&&technicianRecord.name)||technicianDisplayName||meta.technician_name||meta.name||user.email}
function normalizeText(v){
 return String(v==null?"":v).trim().replace(/\s+/g," ").toLowerCase();
}
function isMyComplaint(c){
 var myId=String(user&&user.id||"").trim().toLowerCase();
 var myTechId=String(technicianRecord&&technicianRecord.id||"").trim().toLowerCase();
 var myCode=normalizeText(technicianRecord&&technicianRecord.technician_code||"");
 var myName=normalizeText((technicianRecord&&technicianRecord.name)||techName());
 var myEmail=normalizeText((technicianRecord&&technicianRecord.email)||(user&&user.email)||"");
 var myPhone=normalizeText((technicianRecord&&technicianRecord.phone)||"");

 function val(v){
   if(v==null)return [];
   if(typeof v==="object"){
     return [
       v.id,v.auth_user_id,v.user_id,v.technician_id,v.technicianId,
       v.name,v.technician_name,v.code,v.technician_code,v.email,v.phone
     ].filter(Boolean).map(function(x){return normalizeText(x)});
   }
   return [normalizeText(v)];
 }

 /* Match every common allocation ID field. */
 var ids=[
   c.technician_auth_user_id,c.technicianAuthUserId,
   c.tech_auth_user_id,c.techAuthUserId,
   c.auth_user_id,c.authUserId,
   c.technician_user_id,c.technicianUserId,
   c.technician_id,c.technicianId,c.tech_id,c.techId,
   c.assigned_technician_id,c.assignedTechnicianId,
   c.assigned_to_id,c.assignedToId,
   c.allocated_to_id,c.allocatedToId
 ].filter(Boolean).map(function(v){return String(v).trim().toLowerCase()});
 if(myId && ids.indexOf(myId)>=0)return true;
 if(myTechId && ids.indexOf(myTechId)>=0)return true;

 /* Match every common allocation/name/code field, including object values. */
 var fields=[
   c.technician,c.technician_name,c.technicianName,
   c.tech,c.tech_name,c.techName,
   c.assigned_technician,c.assignedTechnician,
   c.assigned_to,c.assignedTo,
   c.allocated_to,c.allocatedTo,
   c.allocated_technician,c.allocatedTechnician,
   c.technician_code,c.technicianCode,
   c.tech_code,c.techCode,
   c.assigned_technician_code,c.assignedTechnicianCode
 ];
 var values=[];
 fields.forEach(function(v){values=values.concat(val(v))});

 var targets=[myName,myCode,myEmail,myPhone].filter(Boolean);
 for(var i=0;i<targets.length;i++){
   if(values.indexOf(targets[i])>=0)return true;
 }

 /* Some service-center versions store the allocation as an object. */
 var objects=[c.technician,c.assigned_technician,c.assignedTechnician,c.assigned_to,c.assignedTo,c.allocated_to,c.allocatedTo];
 for(var j=0;j<objects.length;j++){
   var o=objects[j];
   if(!o||typeof o!=="object")continue;
   var oid=[o.id,o.auth_user_id,o.user_id,o.technician_id,o.technicianId].filter(Boolean).map(function(x){return String(x).trim().toLowerCase()});
   if(myId&&oid.indexOf(myId)>=0)return true;
   if(myTechId&&oid.indexOf(myTechId)>=0)return true;
 }

 return false;
}
function myComplaints(){

function stockRows(){
 var m={};
 var myId=String(user&&user.id||"");
 var myTechId=String(technicianRecord&&technicianRecord.id||"");
 var myName=String(techName()||"").trim().toLowerCase();
 var myCode=String(technicianRecord&&technicianRecord.technician_code||"").trim().toLowerCase();

 function isMine(x){
  var ids=[
   x.tech_auth_user_id,x.technician_auth_user_id,x.technician_user_id,
   x.tech_id,x.technician_id
  ].filter(Boolean).map(String);
  if(ids.length && (ids.indexOf(myId)>=0 || ids.indexOf(myTechId)>=0))return true;
  var names=[
   x.tech,x.technician,x.technician_name,x.tech_name,x.assigned_technician
  ].filter(Boolean).map(function(v){return String(v).trim().toLowerCase()});
  if(names.length && (names.indexOf(myName)>=0 || (myCode&&names.indexOf(myCode)>=0)))return true;
  return !ids.length&&!names.length;
 }
 function typeOf(x){return String(x.type||x.transaction_type||x.txn_type||x.action||"").toLowerCase().replace(/[- ]/g,"_");}
 function qtyOf(x){var q=Number(x.qty!=null?x.qty:(x.quantity!=null?x.quantity:0));return Number.isFinite(q)?q:0;}

 DATA.txns.forEach(function(x){
  if(!isMine(x))return;
  var partNo=x.partNo||x.part_no||x.spare_part_no||x.part_number||"";
  var partName=x.partName||x.part_name||x.spare_part_name||x.name||"";
  var k=[x.company||"",x.product||"",x.model||"",partNo].join("|");
  if(!m[k])m[k]={
   company:x.company||"",product:x.product||"",model:x.model||"",
   partNo:partNo,partName:partName,fresh:0,defective:0
  };
  var q=qtyOf(x), typ=typeOf(x);

  /* Technician stock received/issued from Service Center. */
  if(["issue","stock_issue","technician_issue","transfer_to_technician","transfer","allocate","allocated","received"].indexOf(typ)>=0){
   m[k].fresh+=q;
  }
  /* Spare consumed on a complaint. */
  if(["use","consume","consumed","used"].indexOf(typ)>=0){
   m[k].fresh-=q;
   m[k].defective+=q;
  }
  /* Defective returned by technician to Service Center. */
  if(["collect","defective_return","return_to_service_center","return"].indexOf(typ)>=0){
   m[k].defective-=q;
  }
 });
 return Object.values(m).filter(function(x){return x.fresh>0||x.defective>0});
}

    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"app_data",filter:"service_center_id=eq."+centerId},

          if(tab==="complaints")applyComplaintFilters();
          else if(tab==="stock")stockFilter();
          else render();
        }).catch(function(){});
      })
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"app_data",filter:"service_center_id=eq."+centerId},
      function(){
        loadData().then(function(){
          if(taskBusy)return;
          if(tab==="complaints")applyComplaintFilters();
          else if(tab==="stock")stockFilter();
          else render();
        }).catch(function(){});
      })
    .subscribe();
 }catch(e){}
 if(complaintSyncTimer)clearInterval(complaintSyncTimer);
 complaintSyncTimer=setInterval(function(){
   if(document.hidden || taskBusy)return;
   loadData().then(function(){
     if(tab==="complaints"){
       applyComplaintFilters();
     }else if(tab==="stock"){

}

function dashboardPageControls(kind,total){
 var size=kind==="complaint"?dashboardComplaintPageSize:dashboardStockPageSize;
 var page=kind==="complaint"?dashboardComplaintPage:dashboardStockPage;
 var pages=Math.max(1,Math.ceil(total/(Number(size)||10)));
 if(page>pages){
   page=pages;
   if(kind==="complaint")dashboardComplaintPage=page;else dashboardStockPage=page;
 }
 var html='<div class="pagination-bar"><div class="muted">'+
   (total?(((page-1)*size+1)+'-'+Math.min(page*size,total)+' of '+total):'0 of 0')+
   '</div><div class="pagination-buttons">';
 [10,20,30].forEach(function(n){
   html+='<button class="page-btn '+(Number(size)===n?'active':'')+
    '" onclick="setDashboardPageSize(\''+kind+'\','+n+')">'+n+'</button>';
 });
 html+='<button class="page-btn" onclick="changeDashboardPage(\''+kind+'\','+(-1)+')" '+(page<=1?'disabled':'')+'>‹</button>';
 var from=Math.max(1,page-2),to=Math.min(pages,page+2);
 for(var i=from;i<=to;i++){
   html+='<button class="page-btn '+(i===page?'active':'')+
    '" onclick="goDashboardPage(\''+kind+'\','+i+')">'+i+'</button>';
 }
 html+='<button class="page-btn" onclick="changeDashboardPage(\''+kind+'\','+1+')" '+(page>=pages?'disabled':'')+'>›</button>';
 return html+'</div></div>';
}
window.setDashboardPageSize=function(kind,n){
 if(kind==="complaint"){dashboardComplaintPageSize=Number(n)||10;dashboardComplaintPage=1;}
 else {dashboardStockPageSize=Number(n)||10;dashboardStockPage=1;}
 render();
};
window.goDashboardPage=function(kind,n){
 if(kind==="complaint")dashboardComplaintPage=Math.max(1,Number(n)||1);
 else dashboardStockPage=Math.max(1,Number(n)||1);
 render();
};
window.changeDashboardPage=function(kind,d){
 if(kind==="complaint")dashboardComplaintPage=Math.max(1,dashboardComplaintPage+(Number(d)||0));
 else dashboardStockPage=Math.max(1,dashboardStockPage+(Number(d)||0));
 render();
};

function home(cs,st){
 var a=cs.filter(c=>String(c.status||"").toUpperCase()==="ASSIGNED").length;
 var p=cs.filter(c=>String(c.status||"").toUpperCase()==="IN PROGRESS").length;
 var c=cs.filter(c=>String(c.status||"").toUpperCase()==="CLOSED").length;

 var cSize=Number(dashboardComplaintPageSize)||10;
 var cPages=Math.max(1,Math.ceil(cs.length/cSize));
 if(dashboardComplaintPage>cPages)dashboardComplaintPage=cPages;
 var cStart=(dashboardComplaintPage-1)*cSize;
 var cRows=cs.slice(cStart,cStart+cSize);

 var sSize=Number(dashboardStockPageSize)||10;
 var sPages=Math.max(1,Math.ceil(st.length/sSize));
 if(dashboardStockPage>sPages)dashboardStockPage=sPages;
 var sStart=(dashboardStockPage-1)*sSize;
 var sRows=st.slice(sStart,sStart+sSize);

 return '<div class="card"><h2>'+t("dashboard")+'</h2><div class="grid">'+
 '<div class="stat"><b>'+a+'</b><span>'+t("assigned")+'</span></div>'+
 '<div class="stat"><b>'+p+'</b><span>'+t("progress")+'</span></div>'+
 '<div class="stat"><b>'+c+'</b><span>'+t("closed")+'</span></div></div></div>'+
 '<div class="card"><h2>'+t("complaints")+'</h2>'+
 '<div class="muted" style="margin-bottom:7px">Dashboard complaints</div>'+
 companyComplaintList(cRows)+dashboardPageControls("complaint",cs.length)+
 '</div>'+
 '<div class="card"><h2>'+t("stock")+'</h2>'+
 '<div class="muted" style="margin-bottom:7px">Dashboard stock items</div>'+
 stockTable(sRows)+dashboardPageControls("stock",st.length)+
 '</div>';
}

function complaintDate(c,mode){
 var v="";
 if(mode==="closed") v=c.closedAt||c.closed_at||c.closeDate||c.closed_date||"";
 else v=c.allocatedAt||c.assignedAt||c.allocated_at||c.assigned_at||c.createdAt||c.created_at||"";
 return v?String(v).slice(0,10):"";
}
function dateRangeMatch(c,mode,from,to){
 if(mode==="all")return true;
 var d=complaintDate(c,mode);
 if(!d)return false;
 if(from&&d<from)return false;
 if(to&&d>to)return false;
 return true;
}
window.clearComplaintDate=function(){
 complaintDateFilterMode="all";complaintFromDate="";complaintToDate="";
 applyComplaintFilters();
};
window.applyComplaintFilters=function(){
 var mode=document.getElementById("complaintDateMode");
 var from=document.getElementById("complaintFrom");
 var to=document.getElementById("complaintTo");
 var status=document.getElementById("complaintStatus");

 if(mode)complaintDateFilterMode=mode.value||"all";
 if(from)complaintFromDate=from.value||"";
 if(to)complaintToDate=to.value||"";
 if(status)complaintFilterStatus=status.value||"all";

 var cs=getFilteredComplaints(myComplaints());

 var box=document.getElementById("complaintList");
 if(box){var pg=complaintPagedRows(cs);box.innerHTML=companyComplaintList(pg.rows)+renderComplaintPagination(cs);}

 var summary=document.getElementById("activeComplaintFilter");
 if(summary){
   var statusText=status?
     status.options[status.selectedIndex].text:
     "All Complaints";

   var modeText=mode?
     mode.options[mode.selectedIndex].text:
     "All Dates";

   var dates=(complaintFromDate||complaintToDate)?
     (" | "+(complaintFromDate||"Any")+" → "+(complaintToDate||"Any")):
     "";

   summary.textContent=
     "Filter: "+statusText+
     " | "+modeText+
     dates+
     (selectedCompany?" | "+selectedCompany:"");
 }
};

function complaintPagedRows(rows){
 var size=Number(complaintPageSize)||10;
 var total=Math.max(1,Math.ceil(rows.length/size));
 if(complaintPage>total)complaintPage=total;
 var start=(complaintPage-1)*size;
 return {rows:rows.slice(start,start+size),total:total,start:start};
}
function renderComplaintPagination(rows){
 var p=complaintPagedRows(rows);
 var html='<div class="pagination-bar"><div class="muted">'+
 (rows.length?((p.start+1)+'-'+Math.min(p.start+p.rows.length,rows.length)+' of '+rows.length):'0 of 0')+
 '</div><div class="pagination-buttons">';
 [10,20,30].forEach(function(n){
   html+='<button class="page-btn '+(Number(complaintPageSize)===n?'active':'')+
   '" onclick="setComplaintPageSize('+n+')">'+n+'</button>';
 });
 html+='<button class="page-btn" onclick="changeComplaintPage(-1)" '+(complaintPage<=1?'disabled':'')+'>‹</button>';
 var from=Math.max(1,complaintPage-2),to=Math.min(p.total,complaintPage+2);
 for(var i=from;i<=to;i++){
   html+='<button class="page-btn '+(i===complaintPage?'active':'')+
   '" onclick="goComplaintPage('+i+')">'+i+'</button>';
 }
 html+='<button class="page-btn" onclick="changeComplaintPage(1)" '+(complaintPage>=p.total?'disabled':'')+'>›</button></div></div>';
 return html;
}

window.goComplaintPage=function(n){complaintPage=Math.max(1,Number(n)||1);applyComplaintFilters();};
window.changeComplaintPage=function(d){complaintPage=Math.max(1,complaintPage+(Number(d)||0));applyComplaintFilters();};

function getFilteredComplaints(cs){
 var filtered=Array.isArray(cs)?cs.slice():[];

 if(selectedCompany){
   filtered=filtered.filter(function(c){
     return String(c.company||"").trim().toLowerCase()===
       String(selectedCompany||"").trim().toLowerCase();
   });
 }

 var sv=String(complaintFilterStatus||"all").toUpperCase();

 if(sv==="OPEN"){
   filtered=filtered.filter(function(c){
     var st=String(c.status||"").trim().toUpperCase();
     return st==="ASSIGNED" || st==="OPEN" || st==="IN PROGRESS";
   });
 }else if(sv==="CLOSED"){
   filtered=filtered.filter(function(c){
     return String(c.status||"").trim().toUpperCase()==="CLOSED";
   });
 }else if(sv==="CANCELLED"){
   filtered=filtered.filter(function(c){
     return String(c.status||"").trim().toUpperCase()==="CANCELLED";
   });
 }else if(sv==="IN PROGRESS"){
   filtered=filtered.filter(function(c){
     return String(c.status||"").trim().toUpperCase()==="IN PROGRESS";
   });
 }

 return filtered.filter(function(c){
   return dateRangeMatch(
     c,
     complaintDateFilterMode,
     complaintFromDate,
     complaintToDate
   );
 });
}

function attachmentItems(c){
 var arr=[];
 var candidates=[c.attachments,c.attachment,c.photos,c.files,c.complaintAttachments,c.documents];
 candidates.forEach(function(v){if(Array.isArray(v))v.forEach(function(x){arr.push(x)});else if(v)arr.push(v)});
 if(!arr.length)return '<p class="muted">No attachments.</p>';
 return arr.map(function(a,i){
  if(typeof a==='string') return '<div class="item">📎 <a href="'+esc(a)+'" target="_blank" rel="noopener">Attachment '+(i+1)+'</a></div>';
  var name=a.name||a.file_name||a.filename||('Attachment '+(i+1));
  var data=a.data||a.url||a.publicUrl||a.public_url||a.path||"";
  var type=a.type||a.mime_type||"";
  var link=data;
  if(link && /^data:image\//i.test(link)) return '<div class="item"><b>📷 '+esc(name)+'</b><br><img src="'+link+'" style="max-width:100%;max-height:260px;border-radius:8px;margin-top:7px"></div>';
  return link ? '<div class="item">📎 <a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(name)+'</a> <span class="muted">'+esc(type)+'</span></div>' : '<div class="item">📎 '+esc(name)+'</div>';
 }).join("");
}

   st.filter(function(x){

window.stockFilter=function(){
 var st=stockRows();

 var co=document.getElementById("sf");
 var pr=document.getElementById("sp");
 var mo=document.getElementById("sm");
 var qel=document.getElementById("sq");

 if(co)stockFilterCompany=co.value||"";
 if(pr)stockFilterProduct=pr.value||"";
 if(mo)stockFilterModel=mo.value||"";
 if(qel)stockFilterPart=qel.value||"";

 var companyKey=String(stockFilterCompany||"").trim().toLowerCase();

 var companyRows=companyKey?
   st.filter(function(x){
     return String(x.company||"").trim().toLowerCase()===companyKey;
   }):st;

 var products=[];
 companyRows.forEach(function(x){
   if(x.product&&products.indexOf(x.product)<0)
     products.push(x.product);
 });

 if(stockFilterProduct &&
    !products.some(function(x){
      return String(x).trim().toLowerCase()===
        String(stockFilterProduct).trim().toLowerCase();
    })){
   stockFilterProduct="";
 }

 var productKey=String(stockFilterProduct||"").trim().toLowerCase();

 var productRows=productKey?
   companyRows.filter(function(x){
     return String(x.product||"").trim().toLowerCase()===productKey;
   }):companyRows;

 var models=[];
 productRows.forEach(function(x){
   if(x.model&&models.indexOf(x.model)<0)
     models.push(x.model);
 });

 if(stockFilterModel &&
    !models.some(function(x){
      return String(x).trim().toLowerCase()===
        String(stockFilterModel).trim().toLowerCase();
    })){
   stockFilterModel="";
 }

 if(pr){
   pr.innerHTML=
     '<option value="">'+t("all")+'</option>'+
     products.map(function(x){
       return '<option value="'+esc(x)+'" '+
         (String(stockFilterProduct).trim().toLowerCase()===String(x).trim().toLowerCase()?"selected":"")+
         '>'+esc(x)+'</option>';
     }).join("");

   pr.value=stockFilterProduct;
 }

 if(mo){
   mo.innerHTML=
     '<option value="">'+t("all")+'</option>'+
     models.map(function(x){
       return '<option value="'+esc(x)+'" '+
         (String(stockFilterModel).trim().toLowerCase()===String(x).trim().toLowerCase()?"selected":"")+
         '>'+esc(x)+'</option>';
     }).join("");

   mo.value=stockFilterModel;
 }

 if(qel)qel.value=stockFilterPart;

 var modelKey=String(stockFilterModel||"").trim().toLowerCase();
 var q=String(stockFilterPart||"").trim().toLowerCase();

 var rows=productRows.filter(function(x){
   return (!modelKey||
     String(x.model||"").trim().toLowerCase()===modelKey) &&
     (!q||
       (String(x.partNo||"")+" "+String(x.partName||""))
       .toLowerCase().indexOf(q)>=0);
 });

 var box=document.getElementById("stockList");
 if(box)box.innerHTML=stockTable(rows);
};
function stockTable(st,limit){

 return Object.keys(groups).map(function(g){return '<div class="item"><b>'+esc(g)+'</b>'+groups[g].map(function(x){

 }).join("")+'</div>'}).join("")
}

function chat(){
 var msgs=Array.isArray(DATA.private_chats)?DATA.private_chats:[];

 return '<div class="card"><h2>💬 '+t("chat")+'</h2><div style="max-height:55vh;overflow:auto">'+
 (mine.length?mine.map(function(m){var me=(m.sender_auth_user_id||m.auth_user_id)===user.id;return '<div class="item" style="margin-left:'+(me?"15%":"0")+';background:'+(me?"#eef4f0":"#fff")+'"><b>'+esc(me?"You":"Service Center")+'</b><p>'+esc(m.message||"")+'</p><span class="muted">'+esc(m.created_at||"")+'</span></div>'}).join(""):'<p class="muted">'+t("noMessages")+'</p>')+
 '</div><label>'+t("message")+'</label><textarea id="chatMsg" placeholder="'+t("chatPlaceholder")+'"></textarea><br><button onclick="sendChat()">'+t("send")+'</button></div>';
}
window.sendChat=function(){
 var box=document.getElementById("chatMsg"),message=(box?box.value:"").trim();if(!message)return;
 DATA.private_chats=Array.isArray(DATA.private_chats)?DATA.private_chats:[];
 DATA.private_chats.push({id:id(),service_center_id:centerId,technician_auth_user_id:user.id,sender_auth_user_id:user.id,sender_type:"TECHNICIAN",message:message,created_at:new Date().toISOString(),read_by_service_center:false});
 saveData().then(function(){toast(t("success"));render()}).catch(function(e){toast(e.message)});
};

function saveLocation(type,complaintId){
 return new Promise(function(resolve,reject){
  if(!navigator.geolocation){reject(new Error("GPS supported नहीं है"));return}
  navigator.geolocation.getCurrentPosition(function(pos){
   var x={id:id(),type:type,technician:techName(),auth_user_id:user.id,service_center_id:centerId,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString(),complaint_id:complaintId||null};
   DATA.gps_logs=Array.isArray(DATA.gps_logs)?DATA.gps_logs:[];DATA.gps_logs.push(x);
   saveData().then(function(){resolve(x)}).catch(reject);
  },function(e){reject(new Error(t("permission")+" "+e.message)),{enableHighAccuracy:true,timeout:15000,maximumAge:0}})
 })
}

async function invokeComplaintAction(body){
 var sr=await sb.auth.getSession();
 if(sr.error||!sr.data.session) throw new Error("Login session expire ho gaya");

 var result=await sb.functions.invoke("manage-complaint-sync",{
   body:body,
   headers:{
     Authorization:"Bearer "+sr.data.session.access_token,
     apikey:KEY
   }
 });

 if(result.error){
   var msg=result.error.message||"Edge Function request failed";
   if(result.data&&result.data.error)msg=result.data.error;
   throw new Error(msg);
 }

 if(!result.data||!result.data.success){
   throw new Error((result.data&&result.data.error)||"Operation failed");
 }

 return result.data;
}

window.startJob=function(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
 if(!c){toast("Complaint not found");return}

 var status=String(c.status||"").toUpperCase();
 if(status==="CLOSED"){toast("Complaint already closed");return}
 if(status==="CANCELLED"){toast("Cancelled complaint cannot be started");return}

 showTaskLoading("Starting job...");
 invokeComplaintAction({
   action:"start",
   complaint_id:c.id,
   startedAt:new Date().toISOString()
 })
 .then(function(result){
   if(result.complaint){
     var i=DATA.complaints.findIndex(function(x){return String(x.id)===String(c.id)});
     if(i>=0)DATA.complaints[i]=result.complaint;
   }
   return loadData();
 })
 .then(function(){
   var saved=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
   if(!saved||String(saved.status||"").toUpperCase()!=="IN PROGRESS")
     throw new Error("Job status database me save nahi hua.");
   toast(lang==="hi"?"काम शुरू हो गया।":"Job started successfully.");
   render();
 })
 .catch(function(e){
   toast("Job start failed: "+e.message);
   loadData().then(function(){
     if(tab==="complaints")applyComplaintFilters(); else render();
   }).catch(function(){});
 })
 .finally(function(){hideTaskLoading();});
};


window.closeJob=function(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});if(!c){toast("Complaint not found");return}
 var old=document.getElementById("closeModal");if(old)old.remove();
 var modal=document.createElement("div");modal.id="closeModal";modal.style="position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px";
 modal.innerHTML='<div class="card" style="width:100%;max-width:520px;max-height:90vh;overflow:auto">'+
 '<h2>'+t("close")+'</h2><p><b>'+esc(c.companyComplaintNo||"")+'</b> · '+esc(c.customer||"")+'</p>'+ 
 '<label>Closing Attachments / फोटो व फाइलें</label>'+ 
 '<div id="closingAttachmentRows"></div>'+ 
 '<button type="button" class="secondary" id="addAttachment">+ Add Attachment / फाइल जोड़ें</button>'+ 
 '<p class="muted">Maximum 8 attachments. प्रत्येक attachment अलग से चुन सकते हैं।</p>'+ 
 '<label>'+t("remark")+' / Remarks</label><textarea id="closeRemark" placeholder="'+t("remark")+'"></textarea><br>'+ 
 '<div class="row"><button id="saveClose">'+t("save")+'</button><button class="secondary" id="cancelClose">Cancel</button></div>'+ 
 '<p id="closeErr" class="error"></p></div>';
 document.body.appendChild(modal);
 var rows=document.getElementById("closingAttachmentRows");
 function addRow(){
  if(rows.children.length>=8){toast("Maximum 8 attachments allowed.");return}
  var row=document.createElement("div");row.className="row";row.style="margin:7px 0;align-items:center";
  row.innerHTML='<input class="closingFile" type="file" accept="image/*,.pdf,.jpg,.jpeg,.png,.webp" style="flex:1"><button type="button" class="danger removeAttachment">×</button>';
  row.querySelector(".removeAttachment").onclick=function(){row.remove()};rows.appendChild(row);
 }
 addRow();document.getElementById("addAttachment").onclick=addRow;
 document.getElementById("cancelClose").onclick=function(){modal.remove()};document.getElementById("saveClose").onclick=function(){saveClosing(cid)};
};

function readAttachment(file){
 return new Promise(function(resolve,reject){
  if(file.size>5*1024*1024){reject(new Error(file.name+" is larger than 5 MB."));return}
  var r=new FileReader();
  r.onload=function(){resolve({
   id:id(),name:file.name,data:r.result,
   type:file.type||"application/octet-stream",
   size:file.size,uploadedAt:new Date().toISOString()
  })};
  r.onerror=function(){reject(new Error("Could not read "+file.name))};
  r.readAsDataURL(file);
 });
}

async function saveClosing(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
 if(!c)return;
 var errBox=document.getElementById("closeErr");
 try{
  var remark=document.getElementById("closeRemark").value.trim();
  var files=Array.from(document.querySelectorAll("#closingAttachmentRows .closingFile"))
   .map(function(el){return el.files&&el.files[0]?el.files[0]:null})
   .filter(Boolean);

  if(files.length>8)throw new Error("Maximum 8 attachments allowed.");
  var attachments=files.length?await Promise.all(files.map(readAttachment)):[];

  showTaskLoading("Closing complaint...");
  var result=await invokeComplaintAction({
   action:"close",
   complaint_id:c.id,
   closeRemark:remark,
   closedAt:new Date().toISOString(),
   attachments:attachments
  });

  if(result.complaint){
   var i=DATA.complaints.findIndex(function(x){return String(x.id)===String(c.id)});
   if(i>=0)DATA.complaints[i]=result.complaint;
  }

  await loadData();

  var saved=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
  if(!saved||String(saved.status).toUpperCase()!=="CLOSED")
    throw new Error("Complaint close database me save nahi hua.");

  var m=document.getElementById("closeModal");
  if(m)m.remove();
  toast(t("success"));
  render();
 }catch(e){
  if(errBox)errBox.textContent="Save failed: "+e.message;
 }finally{
  hideTaskLoading();
 }
}

window.consume=function(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
 if(!c){toast("Complaint not found");return}

 if(["CLOSED","CANCELLED"].indexOf(String(c.status||"").toUpperCase())>=0){
   toast("Complaint already closed/cancelled.");
   return;
 }

 var company=String(c.company||c.companyName||c.company_name||"").trim().toLowerCase();
 var all=stockRows().filter(function(x){
   return Number(x.fresh)>0 &&
     (!company||String(x.company||"").trim().toLowerCase()===company);
 });

 if(!all.length){
   toast("इस company का technician fresh stock उपलब्ध नहीं है।");
   return;
 }

 var modal=document.getElementById("consumeModal");
 if(modal)modal.remove();

 modal=document.createElement("div");
 modal.id="consumeModal";
 modal.style="position:fixed;inset:0;background:#0008;z-index:55;display:flex;align-items:center;justify-content:center;padding:14px";
 modal.innerHTML='<div class="card" style="width:100%;max-width:520px">'+
 '<h2>'+t("consume")+'</h2>'+
 '<p><b>'+esc(c.companyComplaintNo||"")+'</b> · '+esc(c.customer||"")+'</p>'+
 '<label>Spare Part / स्पेयर पार्ट</label>'+
 '<input id="directConsumeSearch" placeholder="🔎 Part No. / Part Name search">'+
 '<select id="directConsumePart"></select>'+
 '<label>'+t("qty")+'</label>'+
 '<input id="directConsumeQty" type="number" min="1" step="1" value="1">'+
 '<label>'+t("remark")+'</label>'+
 '<textarea id="directConsumeRemark"></textarea>'+
 '<div class="row"><button id="directConsumeSave">'+t("save")+'</button>'+ 
 '<button class="secondary" id="directConsumeCancel">Cancel</button></div>'+
 '<p id="directConsumeError" class="error"></p></div>';

 document.body.appendChild(modal);

 var consumeParts=all.slice();
 function consumeKey(x){
   return [x.company||"",x.product||"",x.model||"",x.partNo||"",x.partName||""].join("¦");
 }
 function renderConsumeParts(){
   var search=(document.getElementById("directConsumeSearch").value||"").trim().toLowerCase();
   var sel=document.getElementById("directConsumePart");
   var current=sel.value;
   var filtered=consumeParts.filter(function(x){
     return !search || (String(x.partNo||"")+" "+String(x.partName||"")+" "+String(x.product||"")+" "+String(x.model||"")).toLowerCase().indexOf(search)>=0;
   });
   sel.innerHTML=filtered.map(function(x){
     var k=consumeKey(x);
     return '<option value="'+esc(k)+'">'+esc(x.partNo)+" — "+esc(x.partName)+" ("+x.fresh+")</option>";
   }).join("");
   if(current && filtered.some(function(x){return consumeKey(x)===current}))sel.value=current;
 }
 renderConsumeParts();
 document.getElementById("directConsumeSearch").oninput=renderConsumeParts;
 document.getElementById("directConsumeCancel").onclick=function(){modal.remove()};

 document.getElementById("directConsumeSave").onclick=async function(){
   var er=document.getElementById("directConsumeError");
   try{
     /* Always re-read latest server data before consuming. */
     await loadData();

     var fresh=stockRows().filter(function(x){
       return Number(x.fresh)>0 &&
         (!company||String(x.company||"").trim().toLowerCase()===company);
     });

     var selectedKey=document.getElementById("directConsumePart").value;
     var p=fresh.find(function(x){
       return [x.company||"",x.product||"",x.model||"",x.partNo||"",x.partName||""].join("¦")===selectedKey;
     });
     var q=Number(document.getElementById("directConsumeQty").value);
     var remark=document.getElementById("directConsumeRemark").value.trim();

     if(!p)throw new Error("Spare part select करें.");
     if(!Number.isInteger(q)||q<1)throw new Error("Valid quantity required.");
     if(q>Number(p.fresh))throw new Error("Insufficient fresh stock. Available: "+p.fresh);

     var requestId=id();

     showTaskLoading("Consuming spare part...");
     var result=await invokeComplaintAction({
       action:"consume",
       complaint_id:c.id,
       transaction:{
         id:id(),
         request_id:requestId,
         type:"use",
         transaction_type:"use",
         date:new Date().toISOString().slice(0,10),
         company:p.company||c.company||"",
         product:p.product||c.product||"",
         model:p.model||c.model||"",
         partNo:p.partNo||"",
         part_no:p.partNo||"",
         partName:p.partName||"",
         part_name:p.partName||"",
         qty:q,
         quantity:q,
         tech:techName(),
         technician:techName(),
         technician_name:techName(),
         technician_id:technicianRecord&&technicianRecord.id||null,
         tech_id:technicianRecord&&technicianRecord.id||null,
         tech_auth_user_id:user.id,
         technician_auth_user_id:user.id,
         technician_user_id:user.id,
         service_center_id:centerId,
         complaint:c.companyComplaintNo||"",
         complaint_id:c.id,
         customer:c.customer||"",
         remarks:remark,
         remark:remark,
         createdAt:new Date().toISOString()
       }
     });

     if(result.complaint){
       var ci=DATA.complaints.findIndex(function(x){return String(x.id)===String(c.id)});
       if(ci>=0)DATA.complaints[ci]=result.complaint;
     }

     await loadData();

     var saved=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
     if(!saved)throw new Error("Complaint refresh failed after consume.");

     modal.remove();
     toast(t("success"));
     render();
   }catch(e){
     console.error("Consume failed",e);
     if(er)er.textContent="Consume failed: "+e.message;
   }finally{
     hideTaskLoading();
   }
 };
};
