window.consume=async cid=>{var c=DATA.complaints.find(x=>String(x.id)===String(cid));if(!c)return;var st=stockRows().filter(x=>n(x.company)===n(c.company)&&x.fresh>0);if(!st.length){toast('इस company का technician fresh stock उपलब्ध नहीं है।');return}var m=document.createElement('div');m.className='modalbg';m.innerHTML='<div class="modal"><h2>'+t('consume')+'</h2><p><b>'+esc(c.companyComplaintNo||'')+'</b> · '+esc(c.customer||'')+'</p><select id="cp"></select><select id="cm"></select><select id="ct"></select><label>'+t('qty')+'</label><input id="cq2" type="number" min="1" value="1"><label>'+t('remark')+'</label><textarea id="cr"></textarea><p id="ce" class="error"></p><div class="row"><button id="cs">'+t('save')+'</button><button class="secondary" onclick="this.closest(\'.modalbg\').remove()">Cancel</button></div></div>';document.body.appendChild(m);var p=[...new Set(st.map(x=>x.product).filter(Boolean))],preferred=c.product||'';cp.innerHTML='<option value="">Product</option>'+p.map(x=>'<option>'+esc(x)+'</option>').join('');if(p.includes(preferred))cp.value=preferred;function fillM(){var a=st.filter(x=>!cp.value||x.product===cp.value),ms=[...new Set(a.map(x=>x.model).filter(Boolean))];cm.innerHTML='<option value="">Model</option>'+ms.map(x=>'<option>'+esc(x)+'</option>').join('');if(c.model&&ms.includes(c.model))cm.value=c.model;fillP()}function fillP(){var a=st.filter(x=>(!cp.value||x.product===cp.value)&&(!cm.value||x.model===cm.value));ct.innerHTML='<option value="">Spare Part</option>'+a.map((x,i)=>'<option value="'+i+'">'+esc(x.partNo)+' — '+esc(x.partName)+' ('+x.fresh+')</option>').join('');ct._a=a}cp.onchange=fillM;cm.onchange=fillP;fillM();cs.onclick=async()=>{try{await loadData();var a=st.filter(x=>(!cp.value||x.product===cp.value)&&(!cm.value||x.model===cm.value));var x=a[Number(ct.value)],q=Number(cq2.value);if(!x||!Number.isInteger(q)||q<1)throw Error('Valid spare part and quantity required');var now=stockRows().find(y=>n(y.company)===n(x.company)&&n(y.product)===n(x.product)&&n(y.model)===n(x.model)&&n(y.partNo)===n(x.partNo));if(!now||q>now.fresh)throw Error('Insufficient fresh stock. Available: '+(now?now.fresh:0));var r=await invoke({action:'consume',complaint_id:String(cid),request_id:uid(),transaction:{type:'use',qty:q,quantity:q,partNo:x.partNo,part_no:x.partNo,spare_part_no:x.partNo,partName:x.partName,company:x.company,product:x.product,model:x.model,remark:cr.value.trim()}});if(!r.success)throw Error(r.error||'Consume failed');await loadData();m.remove();render();toast(t('save'))}catch(e){ce.textContent='Consume failed: '+e.message}}};
window.closeJob=cid=>{var c=DATA.complaints.find(x=>String(x.id)===String(cid));if(!c)return;var m=document.createElement('div');m.className='modalbg';m.innerHTML='<div class="modal"><h2>'+t('close')+'</h2><p><b>'+esc(c.companyComplaintNo||'')+'</b> · '+esc(c.customer||'')+'</p><label>Closing Attachments / फोटो</label><div id="files"></div><button class="secondary" id="addf">+ Add Attachment</button><label>'+t('remark')+'</label><textarea id="clr"></textarea><p id="cle" class="error"></p><div class="row"><button id="cls">'+t('save')+'</button><button class="secondary" onclick="this.closest(\'.modalbg\').remove()">Cancel</button></div></div>';document.body.appendChild(m);function add(){if(files.children.length>=8){toast('Maximum 8 attachments');return}var r=document.createElement('div');r.innerHTML='<input class="cf" type="file" accept="image/*,.pdf"><button type="button" class="danger">×</button>';r.querySelector('button').onclick=()=>r.remove();files.appendChild(r)}add();addf.onclick=add;cls.onclick=async()=>{try{var at=[];for(var e of document.querySelectorAll('.cf'))if(e.files[0]){var f=e.files[0];if(f.size>5*1024*1024)throw Error(f.name+' is larger than 5 MB');at.push(await new Promise((res,rej)=>{var r=new FileReader();r.onload=()=>res({id:uid(),name:f.name,data:r.result,type:f.type||'application/octet-stream',size:f.size,uploadedAt:new Date().toISOString()});r.onerror=rej;r.readAsDataURL(f)}))}var r=await invoke({action:'close',complaint_id:String(cid),closeRemark:clr.value.trim(),closedAt:new Date().toISOString(),attachments:at});if(!r.success)throw Error(r.error||'Close failed');await loadData();m.remove();render();toast(t('save'))}catch(e){cle.textContent='Save failed: '+e.message}}};
function render(){var a=cs(),st=stockRows();root.innerHTML='<div style="background:#2f5d4f;color:white"><div class="wrap"><div class="row" style="justify-content:space-between"><div><h1 style="margin:0">Ananta Technician</h1><div>'+esc(centerName)+'</div><small>👤 '+esc(tech.name||'')+' · '+esc(tech.technician_code||'')+'</small></div><div class="row"><button class="secondary" onclick="refreshAppData()">↻ '+t('refresh')+'</button><button class="secondary" onclick="switchLang()">'+(lang==='hi'?'English':'हिंदी')+'</button><button class="danger" onclick="logout()">'+t('logout')+'</button></div></div></div></div><main class="wrap"><div class="tabs"><button class="tab '+(tab==='home'?'active':'')+'" onclick="setTab(\'home\')">'+t('dashboard')+'</button><button class="tab '+(tab==='complaints'?'active':'')+'" onclick="setTab(\'complaints\')">'+t('complaints')+'</button><button class="tab '+(tab==='stock'?'active':'')+'" onclick="setTab(\'stock\')">'+t('stock')+'</button><button class="tab '+(tab==='tracking'?'active':'')+'" onclick="setTab(\'tracking\')">'+t('tracking')+'</button><button class="tab '+(tab==='chat'?'active':'')+'" onclick="setTab(\'chat\')">'+t('chat')+'</button></div>'+(tab==='home'?home():tab==='complaints'?complaintsPage():tab==='stock'?stockPage():tab==='tracking'?tracking():chat())+'</main>'}window.setTab=x=>{tab=x;render()};window.refreshAppData=async()=>{try{await loadData();render()}catch(e){toast('Refresh failed: '+e.message)}};
function startSync(){try{if(channel)sb.removeChannel(channel);channel=sb.channel('tech-sync-'+centerId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_data',filter:'service_center_id=eq.'+centerId},()=>loadData().then(render).catch(()=>{})).on('postgres_changes',{event:'INSERT',schema:'public',table:'app_data',filter:'service_center_id=eq.'+centerId},()=>loadData().then(render).catch(()=>{})).subscribe()}catch(e){}if(timer)clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)loadData().then(render).catch(()=>{})},5000)}
function start(){loadLib(e=>{if(e){loginPage(e.message);return}sb=window.supabase.createClient(URL,KEY);sb.auth.getSession().then(r=>r.data?.session?boot():loginPage(''))})}start();
})();
</script></body></html>
