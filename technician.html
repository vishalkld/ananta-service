async function loadData(){

  const session=await sb.auth.getSession();
  if(session.error||!session.data.session) throw new Error("Login session expire ho gaya");

  const r=await fetch(URL+"/functions/v1/manage-complaint-sync",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+session.data.session.access_token
    },
    body:JSON.stringify({action:"read"})
  });

  const raw=await r.text();
  let result={};
  try{result=raw?JSON.parse(raw):{}}
  catch(e){throw new Error(raw||"Invalid server response")}

  if(!r.ok||!result.success){
    throw new Error(result.error||result.message||raw||("HTTP "+r.status));
  }

  DATA=DATA||{};
  DATA.complaints=Array.isArray(result.complaints)?result.complaints:[];
  DATA.technicianStock=Array.isArray(result.technicianStock)?result.technicianStock:[];
  DATA.technician_stock=Array.isArray(result.technician_stock)?result.technician_stock:DATA.technicianStock;
  DATA.technicianInventory=Array.isArray(result.technicianInventory)?result.technicianInventory:DATA.technicianStock;
  DATA.technician_inventory=Array.isArray(result.technician_inventory)?result.technician_inventory:DATA.technicianStock;
  DATA.stock=Array.isArray(result.stock)?result.stock:DATA.technicianStock;
  DATA.txns=Array.isArray(result.txns)?result.txns:[];
  DATA.catalog=Array.isArray(result.catalog)?result.catalog:[];
  DATA.companies=Array.isArray(result.companies)?result.companies:[];
  DATA.technicians=Array.isArray(result.technicians)?result.technicians:[];
  DATA.private_chats=Array.isArray(result.private_chats)?result.private_chats:[];
  DATA.updated_at=result.updated_at||null;

  if(result.technician){
    technicianRecord=Object.assign({},technicianRecord||{},result.technician);
    technicianDisplayName=result.technician.name||technicianDisplayName||user.email;
    centerId=result.technician.service_center_id||centerId;
  }

  return DATA;
}

function mergeByUpdatedAt(serverArr, localArr){
 var sm=new Map(), out=[];
 (Array.isArray(serverArr)?serverArr:[]).forEach(function(x){if(x&&x.id!=null)sm.set(String(x.id),x);});
 (Array.isArray(localArr)?localArr:[]).forEach(function(x){
   if(!x||x.id==null){out.push(x);return}
   var k=String(x.id), old=sm.get(k);
   if(!old){sm.set(k,x);return}
   var sd=new Date(old.updatedAt||old.updated_at||old.createdAt||old.created_at||0).getTime();
   var ld=new Date(x.updatedAt||x.updated_at||x.createdAt||x.created_at||0).getTime();
   if(ld>=sd)sm.set(k,x);
 });
 sm.forEach(function(x){out.push(x)});
 return out;
}
function mergeTechnicianData(server, local){
 server=server||{};local=local||{};
 var merged=Object.assign({},server,local);
 /* Complaints: union + newest updatedAt wins. This prevents a stale
    technician snapshot from deleting a newly allocated complaint. */
 merged.complaints=mergeByUpdatedAt(server.complaints,local.complaints);
 /* Transactions/messages are append-only: union by id. */
 merged.txns=mergeByUpdatedAt(server.txns,local.txns);
 merged.private_chats=mergeByUpdatedAt(server.private_chats,local.private_chats);
 /* Keep server catalog/companies/technicians as the source of truth. */
 merged.catalog=Array.isArray(server.catalog)?server.catalog:(local.catalog||[]);
 merged.companies=Array.isArray(server.companies)?server.companies:(local.companies||[]);
 merged.technicians=Array.isArray(server.technicians)?server.technicians:(local.technicians||[]);
 return merged;
}
async function saveData(){
 var now=new Date().toISOString();

 async function attemptSave(){
  var latest=await sb.from("app_data")
    .select("data,updated_at")
    .eq("service_center_id",centerId)
    .order("updated_at",{ascending:false})
    .limit(1)
    .maybeSingle();

  if(latest.error)throw new Error("Database read before save failed: "+latest.error.message);
  if(!latest.data)throw new Error("Service Center database record not found.");

  var merged=mergeTechnicianData(latest.data.data,DATA);
  merged.updated_at=now;

  var q=sb.from("app_data")
    .update({data:merged,updated_at:now})
    .eq("service_center_id",centerId);

  /* Optimistic concurrency: update the same server version we just read. */
  if(latest.data.updated_at){
    q=q.eq("updated_at",latest.data.updated_at);
  }

  var u=await q.select("service_center_id,updated_at");
  if(u.error)throw new Error("Database update failed: "+u.error.message);

  /* Zero rows means another user saved between our read and write. */
  if(!u.data||!u.data.length)return false;

  DATA=merged;
  return true;
 }

 /* Retry once against the newest server snapshot on a write conflict. */
 var ok=await attemptSave();
 if(!ok)ok=await attemptSave();
 if(!ok)throw new Error("Database changed while saving. Please press Refresh and try again.");
 return true;
}
function techName(){return (technicianRecord&&technicianRecord.name)||technicianDisplayName||meta.technician_name||meta.name||user.email}
function normalizeText(v){
 return String(v==null?"":v).trim().replace(/\s+/g," ").toLowerCase();
}
function isMyComplaint(c){
 var myId=String(user&&user.id||"").trim().toLowerCase();
 var myTechId=String(technicianRecord&&technicianRecord.id||"").trim().toLowerCase();
 var myCode=normalizeText(technicianRecord&&technicianRecord.technician_code||"");
 var myName=normalizeText((technicianRecord&&technicianRecord.name)||techName());
 var myEmail=normalizeText((technicianRecord&&technicianRecord.email)||(user&&user.email)||"");
 var myPhone=normalizeText((technicianRecord&&technicianRecord.phone)||"");

 function val(v){
   if(v==null)return [];
   if(typeof v==="object"){
     return [
       v.id,v.auth_user_id,v.user_id,v.technician_id,v.technicianId,
       v.name,v.technician_name,v.code,v.technician_code,v.email,v.phone
     ].filter(Boolean).map(function(x){return normalizeText(x)});
   }
   return [normalizeText(v)];
 }

 /* Match every common allocation ID field. */
 var ids=[
   c.technician_auth_user_id,c.technicianAuthUserId,
   c.tech_auth_user_id,c.techAuthUserId,
   c.auth_user_id,c.authUserId,
   c.technician_user_id,c.technicianUserId,
   c.technician_id,c.technicianId,c.tech_id,c.techId,
   c.assigned_technician_id,c.assignedTechnicianId,
   c.assigned_to_id,c.assignedToId,
   c.allocated_to_id,c.allocatedToId
 ].filter(Boolean).map(function(v){return String(v).trim().toLowerCase()});
 if(myId && ids.indexOf(myId)>=0)return true;
 if(myTechId && ids.indexOf(myTechId)>=0)return true;

 /* Match every common allocation/name/code field, including object values. */
 var fields=[
   c.technician,c.technician_name,c.technicianName,
   c.tech,c.tech_name,c.techName,
   c.assigned_technician,c.assignedTechnician,
   c.assigned_to,c.assignedTo,
   c.allocated_to,c.allocatedTo,
   c.allocated_technician,c.allocatedTechnician,
   c.technician_code,c.technicianCode,
   c.tech_code,c.techCode,
   c.assigned_technician_code,c.assignedTechnicianCode
 ];
 var values=[];
 fields.forEach(function(v){values=values.concat(val(v))});

 var targets=[myName,myCode,myEmail,myPhone].filter(Boolean);
 for(var i=0;i<targets.length;i++){
   if(values.indexOf(targets[i])>=0)return true;
 }

 /* Some service-center versions store the allocation as an object. */
 var objects=[c.technician,c.assigned_technician,c.assignedTechnician,c.assigned_to,c.assignedTo,c.allocated_to,c.allocatedTo];
 for(var j=0;j<objects.length;j++){
   var o=objects[j];
   if(!o||typeof o!=="object")continue;
   var oid=[o.id,o.auth_user_id,o.user_id,o.technician_id,o.technicianId].filter(Boolean).map(function(x){return String(x).trim().toLowerCase()});
   if(myId&&oid.indexOf(myId)>=0)return true;
   if(myTechId&&oid.indexOf(myTechId)>=0)return true;
 }

 return false;
}
function myComplaints(){

function stockRows(){
  var source=Array.isArray(DATA.technicianStock)
    ?DATA.technicianStock
    :(Array.isArray(DATA.technician_stock)
      ?DATA.technician_stock
      :(Array.isArray(DATA.technicianInventory)
        ?DATA.technicianInventory
        :(Array.isArray(DATA.stock)?DATA.stock:[])));

  var myId=String(technicianRecord&&technicianRecord.id||"").toLowerCase();
  var myAuth=String(user&&user.id||"").toLowerCase();

  function mine(x){
    var ids=[
      x.technician_id,x.technicianId,x.tech_id,x.techId,
      x.technician_auth_user_id,x.technicianAuthUserId
    ].filter(Boolean).map(function(v){return String(v).toLowerCase()});

    if(!ids.length)return true;
    return ids.indexOf(myId)>=0||ids.indexOf(myAuth)>=0;
  }

  return source.filter(mine).map(function(x){
    var fresh=Number(
      x.fresh_quantity!=null?x.fresh_quantity:
      x.freshQuantity!=null?x.freshQuantity:
      x.quantity!=null?x.quantity:
      x.qty!=null?x.qty:0
    );
    var defective=Number(
      x.defective_quantity!=null?x.defective_quantity:
      x.defectiveQuantity!=null?x.defectiveQuantity:
      x.defective!=null?x.defective:0
    );

    return {
      id:x.id||x.spare_part_id||x.part_id||"",
      company:x.company||x.company_name||x.companyName||"",
      product:x.product||x.product_name||x.productName||"",
      model:x.model||x.model_name||x.modelName||"",
      partNo:x.partNo||x.part_no||x.spare_part_code||x.sparePartCode||x.part_code||x.code||"",
      partName:x.partName||x.part_name||x.spare_part_name||x.sparePartName||x.name||"",
      fresh:Number.isFinite(fresh)?fresh:0,
      defective:Number.isFinite(defective)?defective:0,
      technician_id:x.technician_id||x.technicianId||null,
      technician_auth_user_id:x.technician_auth_user_id||x.technicianAuthUserId||null,
      spare_part_id:x.spare_part_id||x.part_id||x.id||null,
      spare_part_code:x.spare_part_code||x.sparePartCode||x.partNo||x.code||null,
      spare_part_name:x.spare_part_name||x.sparePartName||x.partName||x.name||null
    };
  }).filter(function(x){return x.fresh>0||x.defective>0});
}

function complaintDate(c,mode){
 var v="";
 if(mode==="closed") v=c.closedAt||c.closed_at||c.closeDate||c.closed_date||"";
 else v=c.allocatedAt||c.assignedAt||c.allocated_at||c.assigned_at||c.createdAt||c.created_at||"";
 return v?String(v).slice(0,10):"";
}
function dateRangeMatch(c,mode,from,to){
 if(mode==="all")return true;
 var d=complaintDate(c,mode);
 if(!d)return false;
 if(from&&d<from)return false;
 if(to&&d>to)return false;
 return true;
}

 var mode=document.getElementById("complaintDateMode");
 var from=document.getElementById("complaintFrom");
 var to=document.getElementById("complaintTo");
 if(!mode||!from||!to)return;
 var cs=myComplaints();
 if(selectedCompany)cs=cs.filter(function(c){return c.company===selectedCompany});

window.clearComplaintDate=function(){
 var m=document.getElementById("complaintDateMode"),f=document.getElementById("complaintFrom"),to=document.getElementById("complaintTo");
 if(m)m.value="all";if(f)f.value="";if(to)to.value="";
 applyComplaintFilters();
};


window.applyComplaintFilters=function(){
 var mode=document.getElementById("complaintDateMode");
 var from=document.getElementById("complaintFrom");
 var to=document.getElementById("complaintTo");
 var status=document.getElementById("complaintStatus");
 if(!mode||!from||!to||!status)return;
 var cs=myComplaints();
 if(selectedCompany)cs=cs.filter(function(c){return c.company===selectedCompany});
 var sv=status.value;
 if(sv==="OPEN")cs=cs.filter(function(c){return ["ASSIGNED","OPEN"].indexOf(String(c.status||"").toUpperCase())>=0});
 else if(sv && sv!=="all")cs=cs.filter(function(c){return String(c.status||"").toUpperCase()===sv});
 cs=cs.filter(function(c){return dateRangeMatch(c,mode.value,from.value,to.value)});
 var box=document.getElementById("complaintList");
 if(box)box.innerHTML=companyComplaintList(cs);
 var summary=document.getElementById("activeComplaintFilter");
 if(summary){
   var statusText=status.options[status.selectedIndex].text;
   var modeText=mode.options[mode.selectedIndex].text;
   var dates=(from.value||to.value)?(" | "+(from.value||"Any")+" → "+(to.value||"Any")):"";
   summary.textContent="Filter: "+statusText+" | "+modeText+dates+(selectedCompany?" | "+selectedCompany:"");
 }
};
window.clearComplaintFilters=function(){
 var ids=["complaintStatus","complaintDateMode","complaintFrom","complaintTo"];
 ids.forEach(function(x){var e=document.getElementById(x);if(e)e.value=(x==="complaintStatus"||x==="complaintDateMode")?"all":""});
 selectedCompany="";
 render();
};

function complaints(cs){

function companyComplaintList(cs){
 if(!cs.length)return '<p class="muted">'+t("no")+'</p>';
 var groups={};cs.forEach(function(c){(groups[c.company||"Other"]||(groups[c.company||"Other"]=[])).push(c)});
 return Object.keys(groups).map(function(g){
  return '<div class="item"><b>'+esc(g)+'</b>'+groups[g].map(function(c){return '<div class="item"><div class="row" style="justify-content:space-between;align-items:center"><div><b>'+esc(c.companyComplaintNo||t("complaint"))+'</b> <span class="badge">'+esc(c.status||"ASSIGNED")+'</span></div><button class="secondary" onclick="viewComplaint(\''+esc(c.id)+'\')">View Complaint</button></div>'+
  '<p>'+t("customer")+': '+esc(c.customer||"")+' · '+esc(c.mobile||"")+'</p><p>'+t("product")+': '+esc(c.product||"")+' · '+t("model")+': '+esc(c.model||"")+'</p><p>'+t("ref")+': '+esc(c.serviceCenterRef||"")+'</p>'+
  '<div class="row">'+(c.status==="ASSIGNED"?'<button onclick="startJob(\''+esc(c.id)+'\')">'+t("start")+'</button>':"")+(c.status!=="CLOSED"&&c.status!=="CANCELLED"?'<button class="secondary" onclick="consume(\''+esc(c.id)+'\')">'+t("consume")+'</button><button onclick="closeJob(\''+esc(c.id)+'\')">'+t("close")+'</button>':"")+'</div></div>'}).join("")+'</div>'
 }).join("")
}

function complaintDetailValue(c, keys){
 for(var i=0;i<keys.length;i++) if(c[keys[i]]!==undefined && c[keys[i]]!==null && String(c[keys[i]]).trim()!=="") return c[keys[i]];
 return "";
}
function attachmentItems(c){
 var arr=[];
 var candidates=[c.attachments,c.attachment,c.photos,c.files,c.complaintAttachments,c.documents];
 candidates.forEach(function(v){if(Array.isArray(v))v.forEach(function(x){arr.push(x)});else if(v)arr.push(v)});
 if(!arr.length)return '<p class="muted">No attachments.</p>';
 return arr.map(function(a,i){
  if(typeof a==='string') return '<div class="item">📎 <a href="'+esc(a)+'" target="_blank" rel="noopener">Attachment '+(i+1)+'</a></div>';
  var name=a.name||a.file_name||a.filename||('Attachment '+(i+1));
  var data=a.data||a.url||a.publicUrl||a.public_url||a.path||"";
  var type=a.type||a.mime_type||"";
  var link=data;
  if(link && /^data:image\//i.test(link)) return '<div class="item"><b>📷 '+esc(name)+'</b><br><img src="'+link+'" style="max-width:100%;max-height:260px;border-radius:8px;margin-top:7px"></div>';
  return link ? '<div class="item">📎 <a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(name)+'</a> <span class="muted">'+esc(type)+'</span></div>' : '<div class="item">📎 '+esc(name)+'</div>';
 }).join("");
}
window.viewComplaint=function(cid){
 var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});if(!c){toast("Complaint not found");return}
 var old=document.getElementById("viewComplaintModal");if(old)old.remove();
 var modal=document.createElement("div");modal.id="viewComplaintModal";modal.style="position:fixed;inset:0;background:#0008;z-index:60;display:flex;align-items:center;justify-content:center;padding:12px";
 var assigned=complaintDetailValue(c,["technician","assigned_technician","technician_name"]);
 var address=complaintDetailValue(c,["customerAddress","customer_address","address","customer_address_line"]);
 var issue=complaintDetailValue(c,["complaintReason","reason","issue","problem","description","complaint_description"]);
 var allocatedModel=complaintDetailValue(c,["model","modelNo","model_no","allocated_model"]);
 var product=complaintDetailValue(c,["product","productName","product_name"]);
 var company=complaintDetailValue(c,["company","companyName","company_name"]);
 var allKeys=Object.keys(c).filter(function(k){return !["id","attachments","attachment","photos","files","complaintAttachments","documents","data"].includes(k) && typeof c[k]!=="object" && c[k]!==null && String(c[k]).trim()!=="";});
 modal.innerHTML='<div class="card" style="width:100%;max-width:650px;max-height:92vh;overflow:auto"><div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">View Complaint</h2><button class="secondary" id="viewClose">×</button></div>'+ 
 '<div class="item"><b>Complaint No.</b><p>'+esc(c.companyComplaintNo||c.complaintNo||c.complaint_number||"")+'</p><b>Status</b><p><span class="badge">'+esc(c.status||"")+'</span></p><b>Company</b><p>'+esc(company)+'</p><b>Product</b><p>'+esc(product)+'</p><b>Model</b><p>'+esc(allocatedModel)+'</p><b>Customer</b><p>'+esc(c.customer||c.customerName||"")+'</p><b>Mobile</b><p>'+esc(c.mobile||c.phone||c.customerMobile||"")+'</p><b>Address</b><p>'+esc(address||"—")+'</p><b>Complaint / Problem</b><p>'+esc(issue||"—")+'</p><b>Service Center Ref.</b><p>'+esc(c.serviceCenterRef||c.service_center_ref||"")+'</p><b>Assigned Technician</b><p>'+esc(assigned||techName())+'</p></div>'+ 
 '<div class="item"><b>Attachments / Documents</b>'+attachmentItems(c)+'</div>'+ 
 (allKeys.length?'<details class="item"><summary><b>Other complaint details</b></summary>'+allKeys.map(function(k){return '<p><b>'+esc(k.replace(/_/g,' '))+':</b> '+esc(c[k])+'</p>'}).join('')+'</details>':'')+
 '<button class="secondary" id="viewClose2">Close</button></div>';
 document.body.appendChild(modal);document.getElementById("viewClose").onclick=function(){modal.remove()};document.getElementById("viewClose2").onclick=function(){modal.remove()};
};
function stock(st){
 var companies=[];st.forEach(x=>{if(x.company&&companies.indexOf(x.company)<0)companies.push(x.company)});
 return '<div class="card"><h2>'+t("stock")+'</h2><label>'+t("company")+'</label><select id="sf" onchange="stockFilter()"><option value="">'+t("all")+'</option>'+companies.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select>'+

window.stockFilter=function(){
 var st=stockRows(),co=document.getElementById("sf").value,pr=document.getElementById("sp").value,mo=document.getElementById("sm").value,q=document.getElementById("sq").value.toLowerCase();
 var f=st.filter(x=>(!co||x.company===co)&&(!pr||x.product===pr)&&(!mo||x.model===mo)&&(!q||(x.partNo+" "+x.partName).toLowerCase().indexOf(q)>=0));

 }).join("")+'</div>'}).join("")

 return '<div class="card"><h2>💬 '+t("chat")+'</h2><div style="max-height:55vh;overflow:auto">'+

 '</div><label>'+t("message")+'</label><textarea id="chatMsg" placeholder="'+t("chatPlaceholder")+'"></textarea><br><button onclick="sendChat()">'+t("send")+'</button></div>';

window.sendChat=function(){
 var box=document.getElementById("chatMsg"),message=(box?box.value:"").trim();if(!message)return;
 DATA.private_chats=Array.isArray(DATA.private_chats)?DATA.private_chats:[];
 DATA.private_chats.push({id:id(),service_center_id:centerId,technician_auth_user_id:user.id,sender_auth_user_id:user.id,sender_type:"TECHNICIAN",message:message,created_at:new Date().toISOString(),read_by_service_center:false});
 saveData().then(function(){toast(t("success"));render()}).catch(function(e){toast(e.message)});
};

function tracking(){
 return '<div class="card"><h2>'+t("tracking")+'</h2><p class="muted">'+t("checkin")+' / '+t("checkout")+' के समय GPS location save होगी। Complaint Start/Close पर भी location save होगी।</p><div class="row"><button onclick="gpsAction(\'CHECK_IN\')">'+t("checkin")+'</button><button class="secondary" onclick="gpsAction(\'GET_GPS\')">'+t("gps")+'</button><button class="danger" onclick="gpsAction(\'CHECK_OUT\')">'+t("checkout")+'</button></div><div id="gpsResult" class="item">—</div></div>'
}
function saveLocation(type,complaintId){
 return new Promise(function(resolve,reject){
  if(!navigator.geolocation){reject(new Error("GPS supported नहीं है"));return}
  navigator.geolocation.getCurrentPosition(function(pos){
   var x={id:id(),type:type,technician:techName(),auth_user_id:user.id,service_center_id:centerId,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString(),complaint_id:complaintId||null};
   DATA.gps_logs=Array.isArray(DATA.gps_logs)?DATA.gps_logs:[];DATA.gps_logs.push(x);
   saveData().then(function(){resolve(x)}).catch(reject);
  },function(e){reject(new Error(t("permission")+" "+e.message)),{enableHighAccuracy:true,timeout:15000,maximumAge:0}})
 })
}

window.startJob=function(cid){
  var c=DATA.complaints.find(function(x){return String(x.id)===String(cid)});
  if(!c){toast("Complaint not found");return}

  var status=String(c.status||"").toUpperCase();
  if(status==="CLOSED"){toast("Complaint already closed");return}
  if(status==="IN PROGRESS"){toast("Job already started");return}

  sb.auth.getSession().then(function(sr){
    if(sr.error||!sr.data||!sr.data.session)throw new Error("Login session expire ho gaya");

    return fetch(URL+"/functions/v1/manage-complaint-sync",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+sr.data.session.access_token
      },
      body:JSON.stringify({
        action:"start",
        complaint_id:String(c.id)
      })
    });
  }).then(function(r){
    return r.text().then(function(raw){
      var result={};
      try{result=raw?JSON.parse(raw):{}}
      catch(e){throw new Error(raw||"Invalid server response")}
      if(!r.ok||!result.success){
        throw new Error(result.error||result.message||raw||("HTTP "+r.status));
      }
      return result;
    });
  }).then(function(){
    return loadData();
  }).then(function(){
    toast(lang==="hi"?"काम शुरू हो गया।":"Job started successfully.");
    render();
  }).catch(function(e){
    toast("Job start failed: "+e.message);
  });
};

function renderError(m){document.getElementById("root").innerHTML='<div class="wrap"><div class="card"><h2>Error</h2><p class="error">'+esc(m)+'</p><button onclick="location.reload()">Reload</button></div></div>'}
start();
function start(){loadLib(function(e){if(e){loginPage(e.message);return}sb=window.supabase.createClient(URL,KEY);sb.auth.getSession().then(function(r){if(r.data&&r.data.session){boot()}else loginPage("")})})}
})();
